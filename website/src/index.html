<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>DevNotes</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#15171c" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Before the first paint: a stored choice, else the system's. Without script, the dark base. -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('devnotes-site-theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
