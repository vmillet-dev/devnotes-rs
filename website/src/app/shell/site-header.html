<header class="site-head">
  <div class="wrap head-row">
    <a class="brand" [routerLink]="links().home" [attr.aria-label]="t().home"
      ><app-logo /><span>DevNotes</span></a
    >
    <span class="here" [class.off]="!here()" [style.--c]="rgb(here()?.tone ?? 'grey')" aria-hidden="true">
      <span class="sw"></span>{{ here()?.name }}
    </span>
    <nav class="site-nav" [attr.aria-label]="t().main">
      <a class="link" [routerLink]="links().home" fragment="snippets">{{ t().features }}</a>
      <a
        class="link"
        [routerLink]="links().docs"
        routerLinkActive="is-current"
        ariaCurrentWhenActive="page"
        >{{ t().docs }}</a
      >
      <a class="btn btn-primary" [routerLink]="links().download">{{ t().download }}</a>
    </nav>
    <a class="icon-btn source" [href]="repository" [attr.aria-label]="t().source" [attr.title]="t().source">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path
          fill="currentColor"
          d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"
        />
      </svg>
    </a>
    <a
      class="icon-btn lang"
      [routerLink]="language.switchTo()"
      [attr.hreflang]="language.other()"
      [attr.lang]="language.other()"
      [attr.aria-label]="t().switchTo"
      [attr.title]="t().switchTo"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z" />
      </svg>
      <span aria-hidden="true">{{ language.other().toUpperCase() }}</span>
    </a>
    <button
      type="button"
      class="icon-btn"
      [attr.aria-label]="theme.theme() === 'dark' ? t().toLight : t().toDark"
      (click)="theme.toggle()"
    >
      @if (theme.theme() === 'dark') {
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </svg>
      } @else {
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
        </svg>
      }
    </button>
    <button
      type="button"
      class="icon-btn menu-btn"
      aria-controls="site-menu"
      [attr.aria-label]="t().menu"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    </button>
  </div>
  <nav class="wrap menu-panel" id="site-menu" [attr.aria-label]="t().menu" [hidden]="!menuOpen()">
    <a [routerLink]="links().home" fragment="snippets">{{ t().features }}</a>
    <a [routerLink]="links().docs" routerLinkActive="is-current" ariaCurrentWhenActive="page">{{
      t().docs
    }}</a>
    <a [routerLink]="links().download" routerLinkActive="is-current" ariaCurrentWhenActive="page">{{
      t().download
    }}</a>
    <a [href]="repository">GitHub</a>
  </nav>
  @if (progress.segments().length) {
    <div class="progress" aria-hidden="true">
      @for (segment of progress.segments(); track segment.anchor; let i = $index) {
        <span [style.--c]="rgb(segment.tone)" [style.--w]="progress.reading().weights[i]">
          <i [style.--f]="progress.reading().fills[i]"></i>
        </span>
      }
    </div>
  }
</header>
