<header class="site-head">
  <div class="wrap head-row">
    <a class="brand" routerLink="/" aria-label="DevNotes, accueil"><app-logo /><span>DevNotes</span></a>
    <span class="here" [class.off]="!here()" [style.--c]="rgb(here()?.tone ?? 'grey')" aria-hidden="true">
      <span class="sw"></span>{{ here()?.name }}
    </span>
    <nav class="site-nav" aria-label="Principale">
      <a class="link" routerLink="/" fragment="snippets">Fonctionnalités</a>
      <a class="link" routerLink="/docs" routerLinkActive="is-current" ariaCurrentWhenActive="page"
        >Documentation</a
      >
      <a class="btn btn-primary" routerLink="/" fragment="telecharger">Télécharger</a>
    </nav>
    <button
      type="button"
      class="icon-btn"
      [attr.aria-label]="theme.theme() === 'dark' ? 'Passer au thème clair' : 'Passer au thème sombre'"
      (click)="theme.toggle()"
    >
      @if (theme.theme() === 'dark') {
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </svg>
      } @else {
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
        </svg>
      }
    </button>
    <button
      type="button"
      class="icon-btn menu-btn"
      aria-controls="site-menu"
      aria-label="Menu"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    </button>
  </div>
  <nav class="wrap menu-panel" id="site-menu" aria-label="Menu" [hidden]="!menuOpen()">
    <a routerLink="/" fragment="snippets">Fonctionnalités</a>
    <a routerLink="/docs" routerLinkActive="is-current" ariaCurrentWhenActive="page">Documentation</a>
    <a routerLink="/" fragment="telecharger">Télécharger</a>
  </nav>
  @if (progress.segments().length) {
    <div class="progress" aria-hidden="true">
      @for (segment of progress.segments(); track segment.anchor; let i = $index) {
        <span [style.--c]="rgb(segment.tone)" [style.--w]="progress.reading().weights[i]">
          <i [style.--f]="progress.reading().fills[i]"></i>
        </span>
      }
    </div>
  }
</header>
