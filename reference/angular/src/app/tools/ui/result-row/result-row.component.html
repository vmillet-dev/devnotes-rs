<div class="row" data-testid="output-row" [attr.data-name]="name()">
  <span class="label">
    <span class="name">{{ name() }}<ng-content select="[rowBadge]" /></span>
    @if (meta()) {
      <span class="meta">{{ meta() }}</span>
    }
  </span>
  <!-- Scrolling inside its block, a long value is reached by the keyboard too. -->
  <code
    class="value"
    data-testid="output-value"
    [attr.tabindex]="long() ? 0 : null"
    [attr.aria-label]="long() ? name() : null"
    >{{ value() }}</code
  >
  @if (copyable()) {
    <app-copy-value [value]="copied() ?? value()" [what]="name()" [compact]="true" />
  }
</div>
