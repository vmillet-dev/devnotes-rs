<div
  appDialogBackdrop
  class="dialog-backdrop"
  [class.fullscreen]="fullscreen()"
  [style.z-index]="rung()"
  (dismissed)="dismiss($event)"
>
  <div
    appFocusTrap
    class="dialog-panel"
    [class.fitted]="variant() === 'fitted'"
    [class.framed]="variant() === 'framed'"
    [class.fullscreen]="fullscreen()"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="labelledBy() ?? null"
    [attr.aria-label]="label() ?? null"
  >
    <ng-content />
  </div>
</div>
