<ul class="fields">
  @for (placeholder of placeholders(); track placeholder.name) {
    <li>
      <label class="field">
        <!-- The braces are drawn in CSS: they tie the row to the token in the
             text, but a screen reader has no use for template punctuation. -->
        <span class="field-name">{{ placeholder.name }}</span>
        <!-- The default is a suggestion, not an entry: an empty field means "I
             keep what the snippet offers", and the back end applies that rule
             when filling. -->
        <input
          #valueInput
          type="text"
          class="field-input"
          data-testid="placeholder-input"
          [attr.data-field]="placeholder.name"
          spellcheck="false"
          autocomplete="off"
          [attr.aria-label]="'placeholders.fieldLabel' | transloco: { name: placeholder.name }"
          [placeholder]="placeholder.defaultValue"
          [value]="valueOf(placeholder.name)"
          (input)="changed.emit({ name: placeholder.name, value: valueInput.value })"
        />
      </label>
    </li>
  }
</ul>
