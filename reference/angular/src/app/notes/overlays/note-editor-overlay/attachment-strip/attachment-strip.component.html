<div class="strip">
  <span class="strip-label">{{ 'attachments.title' | transloco }}</span>

  @for (attachment of attachments(); track attachment.id) {
    <span
      class="strip-item"
      data-testid="attachment-item"
      [attr.data-file-name]="attachment.fileName"
      [class.previewing]="previewId() === attachment.id"
    >
      <!-- Open with the default application: what makes a PDF or an archive usable. -->
      <button
        type="button"
        class="strip-name"
        data-testid="attachment-open"
        [attr.aria-label]="'attachments.open' | transloco: { name: attachment.fileName }"
        (click)="openRequested.emit(attachment.id)"
      >
        <span aria-hidden="true">{{ isImage(attachment) ? '🖼' : '📎' }}</span>
        {{ attachment.fileName }}
        <span class="strip-size">
          {{ 'attachments.size' | transloco: { size: sizeInKb(attachment) } }}
        </span>
      </button>

      @if (isImage(attachment)) {
        <button
          type="button"
          class="strip-icon"
          [attr.aria-pressed]="previewId() === attachment.id"
          [attr.aria-label]="'attachments.openPreview' | transloco: { name: attachment.fileName }"
          [attr.title]="'attachments.openPreview' | transloco: { name: attachment.fileName }"
          (click)="previewToggled.emit(attachment.id)"
        >
          <span aria-hidden="true">👁</span>
        </button>
      }

      <button
        type="button"
        class="strip-icon"
        [attr.aria-label]="'attachments.save' | transloco: { name: attachment.fileName }"
        [attr.title]="'attachments.save' | transloco: { name: attachment.fileName }"
        (click)="saveRequested.emit(attachment.id)"
      >
        <span aria-hidden="true">⭳</span>
      </button>

      <button
        type="button"
        class="strip-icon strip-remove"
        data-testid="attachment-remove"
        [attr.data-attachment-id]="attachment.id"
        [class.confirming]="confirmingRemove() === attachment.id"
        [attr.aria-label]="'attachments.remove' | transloco: { name: attachment.fileName }"
        [attr.title]="'attachments.remove' | transloco: { name: attachment.fileName }"
        (click)="onRemoveClick(attachment.id)"
      >
        <span aria-hidden="true">{{ confirmingRemove() === attachment.id ? '?' : '✕' }}</span>
      </button>
    </span>
  } @empty {
    <span class="strip-empty" data-testid="attachment-empty">{{
      'attachments.dropHint' | transloco: { limit: maxMegabytes }
    }}</span>
  }

  <button
    type="button"
    class="strip-add"
    data-testid="attachment-add"
    [attr.aria-disabled]="isBusy()"
    (click)="addRequested.emit()"
  >
    {{ (isBusy() ? 'attachments.adding' : 'attachments.add') | transloco }}
  </button>
</div>

@if (previewed(); as attachment) {
  <div class="strip-preview">
    @if (previewData(); as data) {
      <!-- A <button> around the image: the lightbox must be reachable by keyboard. -->
      <button
        type="button"
        class="strip-preview-zoom"
        [attr.aria-label]="'attachments.zoom' | transloco: { name: attachment.fileName }"
        (click)="zoomRequested.emit()"
      >
        <!-- A `data:` URI and not a file path: the CSP only allows `img-src 'self' data:`. -->
        <img
          class="strip-preview-image"
          [src]="data"
          [alt]="'attachments.preview' | transloco: { name: attachment.fileName }"
        />
      </button>
    }
    <button type="button" class="strip-preview-close" (click)="previewToggled.emit(attachment.id)">
      {{ 'attachments.closePreview' | transloco }}
    </button>
  </div>
}
