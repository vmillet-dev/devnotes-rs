<section class="panel" [class.open]="open()">
  <div class="panel-head">
    <!-- The whole strip is the button: a row that lights up on hover reads as a
         control, where a bare label reads as a section heading. -->
    <button
      type="button"
      class="panel-toggle"
      data-testid="placeholder-panel-toggle"
      [attr.aria-expanded]="open()"
      (click)="toggled.emit()"
    >
      <span class="panel-caret" aria-hidden="true">▸</span>
      <span class="panel-title">{{ 'placeholders.panelTitle' | transloco }}</span>
      <span
        class="panel-count"
        data-testid="placeholder-panel-count"
        [class.complete]="filled() === total()"
        aria-hidden="true"
      >
        {{ filled() }}/{{ total() }}
      </span>
      <span class="visually-hidden">
        {{ 'placeholders.filledCount' | transloco: { filled: filled(), total: total() } }}
      </span>

      @if (!open()) {
        <span class="panel-summary">
          @for (entry of visibleSummary(); track entry.name) {
            <span class="panel-pair">
              <span class="panel-pair-name">{{ entry.name }}</span> = {{ entry.value }}
            </span>
          }
          @if (hiddenSummary() > 0) {
            <span class="panel-pair">
              {{ 'placeholders.summaryMore' | transloco: { count: hiddenSummary() } }}
            </span>
          }
        </span>
        <span class="panel-verb">{{ 'placeholders.show' | transloco }}</span>
      }
    </button>

    @if (open()) {
      <div class="panel-actions">
        <button
          type="button"
          class="panel-action"
          [class.active]="previewing()"
          [attr.aria-pressed]="previewing()"
          (click)="previewToggled.emit()"
        >
          <span aria-hidden="true">👁</span>
          {{ 'placeholders.preview' | transloco }}
        </button>
        <app-copy-button [value]="rawContent()" [showLabel]="true" label="placeholders.copyRaw" />
        @if (filled() > 0) {
          <button type="button" class="panel-action" (click)="reset()">
            {{ 'placeholders.reset' | transloco }}
          </button>
        }
      </div>
    }
  </div>

  @if (open()) {
    <!-- `focusout` and not `blur`: it bubbles, so one listener covers every row. -->
    <div class="panel-body" (focusout)="commit()">
      <app-placeholder-fields
        [placeholders]="placeholders()"
        [values]="values()"
        (changed)="onChanged($event)"
      />
      <p class="panel-hint">{{ 'placeholders.panelHint' | transloco }}</p>
    </div>
  }
</section>
