<app-dialog [layer]="'fields'" labelledBy="folder-name-title" (closed)="cancelled.emit()">
  <form class="name-form" data-testid="folder-name-prompt" (submit)="submit($event, nameInput.value)">
    <h2 id="folder-name-title" class="name-title">{{ 'board.nameTheZone' | transloco }}</h2>
    <p class="name-hint">{{ 'board.nameTheZoneHint' | transloco }}</p>

    <input
      #nameInput
      type="text"
      class="name-input"
      data-testid="folder-name-input"
      [attr.aria-label]="'folders.newFolderLabel' | transloco"
      [placeholder]="'folders.newFolderPlaceholder' | transloco"
    />

    <div class="name-actions">
      <button type="button" class="name-action" data-testid="folder-name-cancel" (click)="cancelled.emit()">
        {{ 'placeholders.cancel' | transloco }}
      </button>
      <button type="submit" class="name-action primary" data-testid="folder-name-submit">
        {{ 'folders.newFolderSubmit' | transloco }}
      </button>
    </div>
  </form>
</app-dialog>
