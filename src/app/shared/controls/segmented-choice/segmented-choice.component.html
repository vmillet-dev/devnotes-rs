<div
  class="segmented"
  role="radiogroup"
  [attr.data-testid]="'segmented-' + kind()"
  [attr.aria-label]="label()"
>
  @for (segment of segments(); track segment.id) {
    <button
      type="button"
      role="radio"
      class="segment"
      data-testid="segment"
      [attr.data-segment-id]="segment.id"
      [class.on]="segment.id === currentId()"
      [attr.aria-checked]="segment.id === currentId()"
      [attr.aria-disabled]="disabledIds().includes(segment.id) || null"
      (click)="pick(segment.id)"
    >
      @if (markedIds().includes(segment.id)) {
        <span class="mark" data-testid="segment-mark" aria-hidden="true"></span>
      }
      {{ segment.labelKey | transloco }}
    </button>
  }
</div>
