@if (notifier.notice(); as notice) {
  <!-- role="alert": the message is announced as it appears, without moving focus. -->
  <div class="error-banner" data-testid="error-banner" role="alert">
    <span class="error-icon" aria-hidden="true">⚠</span>
    <span class="error-text">
      {{ notice.ref.key | transloco: notice.ref.params }}
      @if (notice.detail) {
        <span class="error-detail">{{ notice.detail }}</span>
      }
    </span>
    <button
      type="button"
      class="error-dismiss"
      data-testid="error-dismiss"
      [attr.aria-label]="'errors.dismiss' | transloco"
      [attr.title]="'errors.dismiss' | transloco"
      (click)="notifier.dismiss()"
    >
      <span aria-hidden="true">✕</span>
    </button>
  </div>
}
