<app-dialog [layer]="'fields'" labelledBy="placeholder-form-title" (closed)="cancelled.emit()">
  <form class="fields-form" data-testid="placeholder-form" (submit)="submit($event)">
    <h2 id="placeholder-form-title" class="fields-title">
      {{ 'placeholders.title' | transloco }}
    </h2>
    <p class="fields-hint">{{ 'placeholders.hint' | transloco: { count: count() } }}</p>

    <div class="fields-list">
      <app-placeholder-fields
        [placeholders]="placeholders()"
        [values]="values()"
        (changed)="setValue($event)"
      />
    </div>

    <div class="fields-actions">
      <button
        type="button"
        class="fields-action"
        data-testid="placeholder-copy-raw"
        (click)="rawRequested.emit()"
      >
        {{ 'placeholders.copyRaw' | transloco }}
      </button>
      <button type="button" class="fields-action" data-testid="placeholder-cancel" (click)="cancelled.emit()">
        {{ 'placeholders.cancel' | transloco }}
      </button>
      <button type="submit" class="fields-action primary" data-testid="placeholder-submit">
        {{ 'placeholders.copy' | transloco }}
      </button>
    </div>
  </form>
</app-dialog>
