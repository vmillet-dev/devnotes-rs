<div class="split">
  <button type="button" class="main" data-testid="http-tab-new" (click)="choose('http')">
    {{ 'http.tabs.new' | transloco }}
  </button>

  <!-- The chevron carries `appMenuAnchor`: it opened the menu, so focus returns to it. -->
  <button
    appMenuAnchor
    type="button"
    class="caret"
    data-testid="http-tab-new-kind"
    aria-haspopup="menu"
    [attr.aria-expanded]="menu.open()"
    [attr.aria-label]="'http.tabs.newKind' | transloco"
    [attr.title]="'http.tabs.newKind' | transloco"
    (click)="menu.toggle()"
  >
    <span aria-hidden="true">▾</span>
  </button>
</div>

@if (menu.open()) {
  <div
    appMenuPanel
    appFloatingPanel
    class="panel"
    data-testid="http-new-kind-panel"
    aria-labelledby="http-new-kind-title"
  >
    <p id="http-new-kind-title" class="panel-title">{{ 'http.kinds.menuTitle' | transloco }}</p>
    @for (entry of kinds; track entry.kind) {
      <button
        appMenuItem
        type="button"
        class="option"
        data-testid="http-new-kind"
        [attr.data-kind]="entry.kind"
        (click)="choose(entry.kind)"
      >
        <span class="glyph" [attr.data-method]="entry.badge" aria-hidden="true">{{ entry.badge }}</span>
        <span class="text">
          <span class="name">{{ 'http.kinds.new.' + entry.kind | transloco }}</span>
          <span class="line">{{ 'http.kinds.lines.' + entry.kind | transloco }}</span>
        </span>
      </button>
    }
  </div>
}
