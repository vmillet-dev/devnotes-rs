<div class="strip" role="tablist" data-testid="http-tabs" [attr.aria-label]="'http.tabs.label' | transloco">
  <app-rail-toggle
    class="rail-toggle"
    testId="http-rail-toggle"
    [shown]="settings.showLibraryRail()"
    (toggled)="settings.toggleLibraryRail()"
  />
  @for (tab of tabs.tabs(); track tab.key) {
    @let active = tab.key === tabs.activeKey();
    @let dirty = tabs.isDirty(tab);
    <div
      class="tab"
      data-testid="http-tab"
      [attr.data-key]="tab.key"
      [attr.data-kind]="tab.draft.kind"
      [class.on]="active"
      [class.dirty]="dirty"
    >
      <button
        type="button"
        role="tab"
        class="tab-open"
        data-testid="http-tab-open"
        [attr.aria-selected]="active"
        (click)="tabs.activate(tab.key)"
        (auxclick)="onAuxClick($event, tab)"
      >
        <span class="method" [attr.data-method]="badge(tab)">{{ short(badge(tab)) }}</span>
        <span class="tab-name">{{ tab.draft.name }}</span>
        @if (sending.isSending(tab.key)) {
          <app-spinner class="tab-sending" data-testid="http-tab-sending" />
          <span class="visually-hidden">{{ 'http.tabs.sending' | transloco }}</span>
        }
        @if (dirty) {
          <span class="dot" data-testid="http-tab-dirty" aria-hidden="true">●</span>
          <span class="visually-hidden">{{ 'http.tabs.modified' | transloco }}</span>
        }
      </button>
      <button
        type="button"
        class="tab-close"
        data-testid="http-tab-close"
        [attr.aria-label]="'http.tabs.close' | transloco: { name: tab.draft.name }"
        [attr.title]="'http.tabs.close' | transloco: { name: tab.draft.name }"
        (click)="close(tab)"
      >
        <span aria-hidden="true">×</span>
      </button>
    </div>
  }
  <!-- At the end of the bar and held there, the tabs scrolling under it: one environment for them all.
       ⚠️ A span: the tabs are the bar's divs, and a scenario reaches the last by `:last-of-type`. -->
  <span class="strip-end">
    <app-new-request-menu (chosen)="tabs.newRequest($event)" />
    <app-environment-picker />
  </span>
</div>
