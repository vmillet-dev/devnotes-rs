<div class="about-wrapper">
  <button
    appMenuAnchor
    type="button"
    class="about-trigger"
    data-testid="about-open"
    aria-haspopup="menu"
    [attr.aria-expanded]="menu.open()"
    (click)="menu.toggle()"
  >
    {{ 'about.menuLabel' | transloco }}
    @if (store.hasPendingUpdate()) {
      <!-- Shown only graphically, so it needs a text twin: the linter asks, and a dot
           nothing announces is a dot half the users never learn about. -->
      <span class="about-dot on-trigger" data-testid="update-dot" aria-hidden="true"></span>
      <span class="visually-hidden">{{ 'about.updateWaiting' | transloco }}</span>
    }
    <span class="chev" aria-hidden="true">▾</span>
  </button>

  @if (menu.open()) {
    <div appMenuPanel class="about-dropdown">
      <button
        appMenuItem
        type="button"
        role="menuitem"
        class="about-option"
        [attr.aria-disabled]="checking()"
        (click)="checkUpdates()"
      >
        <!-- The trigger's dot says something is waiting; this one says what for. The
             entry is a column, so the label and the dot need a row of their own. -->
        <span class="about-option-label">
          {{ 'about.checkUpdates' | transloco }}
          @if (store.hasPendingUpdate()) {
            <span class="about-dot" data-testid="update-dot-option" aria-hidden="true"></span>
            <span class="visually-hidden">{{ 'about.updateWaiting' | transloco }}</span>
          }
        </span>
        <!-- aria-live: the result arrives after the click and must be announced without
             moving focus. -->
        <span class="about-option-status" aria-live="polite">
          @if (checkStatusRef(); as ref) {
            {{ ref.key | transloco }}
          }
        </span>
      </button>

      <!-- Not an `appMenuItem`: the arrow keys step over it, as they should. -->
      <div class="about-separator" role="separator"></div>

      <button appMenuItem type="button" role="menuitem" class="about-option" (click)="openPanel('whatsNew')">
        {{ 'about.whatsNew' | transloco }}
      </button>

      <button
        appMenuItem
        type="button"
        role="menuitem"
        class="about-option"
        data-testid="about-getting-started"
        (click)="openPanel('gettingStarted')"
      >
        {{ 'about.gettingStarted' | transloco }}
      </button>

      <button appMenuItem type="button" role="menuitem" class="about-option" (click)="openPanel('shortcuts')">
        {{ 'about.shortcuts' | transloco }}
      </button>

      <div class="about-separator" role="separator"></div>

      <button appMenuItem type="button" role="menuitem" class="about-option" (click)="openPanel('about')">
        {{ 'about.openAbout' | transloco }}
      </button>
    </div>
  }
</div>

@switch (showing()) {
  @case ('whatsNew') {
    <app-whats-new-dialog (closed)="closePanel()" />
  }
  @case ('gettingStarted') {
    <app-getting-started-dialog [startAt]="help.chapter() ?? 'notes'" (closed)="closePanel()" />
  }
  @case ('shortcuts') {
    <app-shortcuts-dialog (closed)="closePanel()" />
  }
  @case ('about') {
    <app-about-dialog (closed)="closePanel()" />
  }
}
