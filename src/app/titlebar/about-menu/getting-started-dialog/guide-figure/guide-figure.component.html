<!-- One `viewBox` for all ten, so the panel's geometry does not move between chapters:
     the figure is a fixed band and only its contents change. -->
<svg viewBox="0 0 320 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <rect class="paper" x="0" y="0" width="320" height="120" rx="8" />

  @switch (chapter()) {
    @case ('notes') {
      <!-- Three cards on the canvas, the first one being written. -->
      <rect class="panel" x="14" y="16" width="90" height="60" rx="6" />
      <rect class="accent-line" x="14" y="16" width="90" height="60" rx="6" />
      <rect class="ink" x="24" y="28" width="46" height="5" rx="2" />
      <rect class="ink" x="24" y="42" width="62" height="3" rx="1.5" opacity="0.6" />
      <rect class="ink" x="24" y="50" width="54" height="3" rx="1.5" opacity="0.6" />
      <rect class="accent" x="24" y="62" width="18" height="6" rx="3" />

      <rect class="panel" x="116" y="16" width="90" height="60" rx="6" />
      <rect class="line" x="116" y="16" width="90" height="60" rx="6" />
      <rect class="ink" x="126" y="28" width="38" height="5" rx="2" />
      <rect class="ink" x="126" y="42" width="58" height="3" rx="1.5" opacity="0.6" />

      <rect class="panel" x="218" y="16" width="90" height="60" rx="6" />
      <rect class="line" x="218" y="16" width="90" height="60" rx="6" />
      <rect class="ink" x="228" y="28" width="52" height="5" rx="2" />
      <rect class="ink" x="228" y="42" width="44" height="3" rx="1.5" opacity="0.6" />

      <rect class="ink" x="14" y="92" width="120" height="4" rx="2" opacity="0.35" />
    }

    @case ('spaces') {
      <!-- The library rail on the left, one space chosen. -->
      <rect class="panel" x="14" y="14" width="78" height="92" rx="6" />
      <rect class="line" x="14" y="14" width="78" height="92" rx="6" />
      <rect class="accent" x="22" y="26" width="8" height="8" rx="2" />
      <rect class="ink" x="36" y="28" width="44" height="4" rx="2" />
      <rect class="ink" x="36" y="46" width="38" height="4" rx="2" opacity="0.55" />
      <rect class="ink" x="36" y="62" width="46" height="4" rx="2" opacity="0.55" />
      <rect class="ink" x="36" y="78" width="32" height="4" rx="2" opacity="0.55" />

      <rect class="panel" x="106" y="14" width="88" height="44" rx="6" />
      <rect class="line" x="106" y="14" width="88" height="44" rx="6" />
      <rect class="panel" x="206" y="14" width="88" height="44" rx="6" />
      <rect class="line" x="206" y="14" width="88" height="44" rx="6" />
      <rect class="panel" x="106" y="66" width="88" height="40" rx="6" />
      <rect class="line" x="106" y="66" width="88" height="40" rx="6" />
    }

    @case ('folders') {
      <!-- A zone holding two cards on the board, one card loose beside it. -->
      <rect class="accent-line" x="14" y="16" width="170" height="88" rx="8" />
      <rect class="accent" x="26" y="26" width="8" height="8" rx="2" />
      <rect class="ink" x="40" y="28" width="44" height="4" rx="2" />
      <rect class="panel" x="26" y="44" width="68" height="46" rx="5" />
      <rect class="line" x="26" y="44" width="68" height="46" rx="5" />
      <rect class="panel" x="104" y="44" width="68" height="46" rx="5" />
      <rect class="line" x="104" y="44" width="68" height="46" rx="5" />

      <rect class="panel" x="200" y="44" width="68" height="46" rx="5" />
      <rect class="line" x="200" y="44" width="68" height="46" rx="5" />
      <rect class="ink" x="210" y="54" width="34" height="4" rx="2" />
    }

    @case ('organise') {
      <!-- The search field, then what it narrowed to. -->
      <rect class="panel" x="14" y="16" width="200" height="22" rx="11" />
      <rect class="accent-line" x="14" y="16" width="200" height="22" rx="11" />
      <circle class="ink" cx="30" cy="27" r="4" />
      <rect class="ink" x="42" y="25" width="72" height="4" rx="2" opacity="0.6" />

      <rect class="accent" x="226" y="19" width="30" height="16" rx="8" />
      <rect class="panel" x="264" y="19" width="42" height="16" rx="8" />
      <rect class="line" x="264" y="19" width="42" height="16" rx="8" />

      <rect class="panel" x="14" y="52" width="136" height="52" rx="6" />
      <rect class="accent-line" x="14" y="52" width="136" height="52" rx="6" />
      <rect class="ink" x="26" y="64" width="60" height="5" rx="2" />
      <rect class="accent" x="26" y="82" width="22" height="6" rx="3" />
      <rect class="ink" x="56" y="82" width="22" height="6" rx="3" opacity="0.4" />

      <rect class="panel" x="164" y="52" width="142" height="52" rx="6" opacity="0.35" />
    }

    @case ('fields') {
      <!-- A snippet holding two tokens, and the form that fills them. -->
      <rect class="panel" x="14" y="16" width="140" height="88" rx="6" />
      <rect class="line" x="14" y="16" width="140" height="88" rx="6" />
      <rect class="ink" x="26" y="30" width="40" height="5" rx="2" />
      <rect class="accent" x="26" y="48" width="44" height="7" rx="3" />
      <rect class="ink" x="78" y="48" width="30" height="7" rx="3" opacity="0.45" />
      <rect class="accent" x="26" y="66" width="34" height="7" rx="3" />
      <rect class="ink" x="68" y="66" width="52" height="7" rx="3" opacity="0.45" />

      <rect class="panel" x="176" y="28" width="130" height="64" rx="6" />
      <rect class="accent-line" x="176" y="28" width="130" height="64" rx="6" />
      <rect class="ink" x="188" y="42" width="34" height="4" rx="2" opacity="0.6" />
      <rect class="panel" x="228" y="38" width="66" height="12" rx="4" />
      <rect class="line" x="228" y="38" width="66" height="12" rx="4" />
      <rect class="ink" x="188" y="66" width="34" height="4" rx="2" opacity="0.6" />
      <rect class="panel" x="228" y="62" width="66" height="12" rx="4" />
      <rect class="line" x="228" y="62" width="66" height="12" rx="4" />
    }

    @case ('checklists') {
      <!-- Ticked, ticked, not yet — and the bar that counts them. -->
      <rect class="panel" x="60" y="14" width="200" height="92" rx="6" />
      <rect class="line" x="60" y="14" width="200" height="92" rx="6" />
      <rect class="ink" x="74" y="26" width="56" height="5" rx="2" />
      <rect class="ink" x="74" y="42" width="172" height="5" rx="2.5" opacity="0.25" />
      <rect class="accent" x="74" y="42" width="112" height="5" rx="2.5" />

      <rect class="accent-line" x="74" y="58" width="10" height="10" rx="2" />
      <rect class="accent" x="77" y="61" width="4" height="4" rx="1" />
      <rect class="ink" x="92" y="61" width="98" height="4" rx="2" opacity="0.45" />

      <rect class="accent-line" x="74" y="76" width="10" height="10" rx="2" />
      <rect class="accent" x="77" y="79" width="4" height="4" rx="1" />
      <rect class="ink" x="92" y="79" width="76" height="4" rx="2" opacity="0.45" />

      <rect class="line" x="74" y="94" width="10" height="10" rx="2" />
      <rect class="ink" x="92" y="97" width="120" height="4" rx="2" />
    }

    @case ('palette') {
      <!-- The window dimmed, the palette over it, one result highlighted. -->
      <rect class="panel" x="8" y="10" width="304" height="100" rx="6" opacity="0.3" />
      <rect class="panel" x="52" y="24" width="216" height="72" rx="8" />
      <rect class="accent-line" x="52" y="24" width="216" height="72" rx="8" />
      <rect class="panel" x="64" y="34" width="192" height="16" rx="5" />
      <rect class="line" x="64" y="34" width="192" height="16" rx="5" />
      <rect class="ink" x="74" y="40" width="54" height="4" rx="2" opacity="0.5" />

      <rect class="accent" x="64" y="58" width="192" height="12" rx="4" opacity="0.25" />
      <rect class="ink" x="74" y="62" width="84" height="4" rx="2" />
      <rect class="ink" x="74" y="80" width="64" height="4" rx="2" opacity="0.45" />
    }

    @case ('attachments') {
      <!-- A file landing on the note that will hold it. -->
      <rect class="panel" x="88" y="34" width="144" height="72" rx="6" />
      <rect class="accent-line" x="88" y="34" width="144" height="72" rx="6" />
      <rect class="ink" x="102" y="48" width="56" height="5" rx="2" />
      <rect class="panel" x="102" y="66" width="40" height="28" rx="4" />
      <rect class="line" x="102" y="66" width="40" height="28" rx="4" />
      <rect class="panel" x="150" y="66" width="40" height="28" rx="4" />
      <rect class="line" x="150" y="66" width="40" height="28" rx="4" />

      <rect class="panel" x="138" y="8" width="44" height="18" rx="4" />
      <rect class="accent-line" x="138" y="8" width="44" height="18" rx="4" />
      <path class="accent-line" d="M160 26 v8" />
      <path class="accent-line" d="M155 30 l5 5 l5 -5" />
    }

    @case ('trash') {
      <!-- The card gone, and the bar that offers it back. -->
      <rect class="line" x="14" y="16" width="92" height="56" rx="6" stroke-dasharray="4 4" />
      <path class="line" d="M44 34 l32 22 M76 34 l-32 22" />

      <rect class="panel" x="118" y="16" width="90" height="56" rx="6" />
      <rect class="line" x="118" y="16" width="90" height="56" rx="6" />
      <rect class="panel" x="220" y="16" width="86" height="56" rx="6" />
      <rect class="line" x="220" y="16" width="86" height="56" rx="6" />

      <rect class="panel" x="72" y="84" width="176" height="24" rx="12" />
      <rect class="accent-line" x="72" y="84" width="176" height="24" rx="12" />
      <rect class="ink" x="86" y="94" width="52" height="4" rx="2" opacity="0.6" />
      <rect class="accent" x="150" y="90" width="44" height="12" rx="6" />
    }

    @case ('transfer') {
      <!-- The library going out to a file, and coming back in. -->
      <rect class="panel" x="14" y="30" width="100" height="60" rx="6" />
      <rect class="line" x="14" y="30" width="100" height="60" rx="6" />
      <rect class="ink" x="28" y="44" width="48" height="4" rx="2" />
      <rect class="ink" x="28" y="58" width="64" height="4" rx="2" opacity="0.5" />
      <rect class="ink" x="28" y="72" width="40" height="4" rx="2" opacity="0.5" />

      <path class="accent-line" d="M124 48 h64" />
      <path class="accent-line" d="M182 43 l6 5 l-6 5" />
      <path class="accent-line" d="M188 72 h-64" />
      <path class="accent-line" d="M130 67 l-6 5 l6 5" />

      <rect class="panel" x="200" y="30" width="106" height="60" rx="6" />
      <rect class="accent-line" x="200" y="30" width="106" height="60" rx="6" />
      <rect class="accent" x="214" y="44" width="28" height="8" rx="3" />
      <rect class="ink" x="214" y="62" width="76" height="4" rx="2" opacity="0.5" />
      <rect class="ink" x="214" y="74" width="58" height="4" rx="2" opacity="0.5" />
    }
  }
</svg>
