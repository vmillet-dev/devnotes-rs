<div class="titlebar">
  <div class="titlebar-menus">
    <div class="dots" aria-hidden="true">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    </div>
    <!--
      ⚠️ Not merely disabled while the library is locked: every entry acts on it, and
      creating the component would have `SpacesStore` query a database nobody has opened
      yet. The About menu reads nothing of the library, so it stays.
    -->
    @if (vault.isUnlocked()) {
      <app-file-menu />
    }
    <app-about-menu />
  </div>

  <div class="titlebar-title" data-testid="titlebar-title">{{ title }}</div>

  <!-- One group, or `space-between` puts the theme in the middle of the bar: the title
       is absolutely positioned and takes no part in the flex row. -->
  <div class="titlebar-choices">
    <!-- Light or dark, never "system": a click is expected to change what is on screen,
         and "system" usually looks exactly like what was already there. Following the
         system is chosen in the preferences panel, which keeps its three rows — and writes
         the same `SettingsStore.theme`, so the two cannot disagree.
         Icon and label both name the **action**: a moon on a light screen. -->
    <button
      type="button"
      class="titlebar-option theme-toggle"
      data-testid="theme-toggle"
      [attr.data-theme-shown]="settings.resolvedTheme()"
      [attr.aria-label]="switchLabel() | transloco"
      [attr.title]="switchLabel() | transloco"
      (click)="toggleTheme()"
    >
      <app-icon [name]="switchesTo() === 'dark' ? 'moon' : 'sun'" />
    </button>

    <div
      class="titlebar-switch locale-switch"
      role="group"
      [attr.aria-label]="'locale.groupLabel' | transloco"
    >
      @for (locale of locales; track locale) {
        <button
          type="button"
          class="titlebar-option locale-option"
          data-testid="locale-option"
          [attr.data-locale]="locale"
          [class.active]="locale === localeService.activeLocale()"
          [attr.aria-pressed]="locale === localeService.activeLocale()"
          [attr.aria-label]="'locale.' + locale | transloco"
          (click)="localeService.setLocale(locale)"
        >
          {{ locale.toUpperCase() }}
        </button>
      }
    </div>
  </div>
</div>
