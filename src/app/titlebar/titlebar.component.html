<div class="titlebar">
  <div class="titlebar-menus">
    <div class="dots" aria-hidden="true">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    </div>
    <!--
      ⚠️ Not merely disabled while the library is locked: every entry acts on it, and
      creating the component would have `SpacesStore` query a database nobody has opened
      yet. The About menu reads nothing of the library, so it stays.
    -->
    @if (vault.isUnlocked()) {
      <app-file-menu />
    }
    <app-about-menu />
  </div>

  <div class="titlebar-title" data-testid="titlebar-title">{{ title }}</div>

  <!-- ⚠️ One group, or `space-between` puts the theme in the middle of the bar: the title
       is absolutely positioned and takes no part in the flex row. -->
  <div class="titlebar-choices">
    <!-- ⚠️ The same shape as the language beside it rather than a second idiom in the same
       corner: the theme and the language are the same kind of choice, and one was one click
       away while the other was three and a page. ⚠️ It writes `SettingsStore.theme`, the
       signal the preferences panel writes, so the two cannot disagree — and the panel keeps
       its row, because a setting that only exists in a corner of the titlebar is a setting
       nobody finds twice. -->
    <div class="titlebar-switch" role="group" [attr.aria-label]="'settings.appearance.theme' | transloco">
      @for (choice of themes; track choice) {
        <button
          type="button"
          class="titlebar-option"
          data-testid="theme-option"
          [attr.data-theme-choice]="choice"
          [class.active]="choice === settings.theme()"
          [attr.aria-pressed]="choice === settings.theme()"
          [attr.aria-label]="'settings.theme.' + choice | transloco"
          [attr.title]="'settings.theme.' + choice | transloco"
          (click)="settings.setTheme(choice)"
        >
          <span aria-hidden="true">{{ glyphs[choice] }}</span>
        </button>
      }
    </div>

    <div
      class="titlebar-switch locale-switch"
      role="group"
      [attr.aria-label]="'locale.groupLabel' | transloco"
    >
      @for (locale of locales; track locale) {
        <button
          type="button"
          class="titlebar-option locale-option"
          data-testid="locale-option"
          [attr.data-locale]="locale"
          [class.active]="locale === localeService.activeLocale()"
          [attr.aria-pressed]="locale === localeService.activeLocale()"
          [attr.aria-label]="'locale.' + locale | transloco"
          (click)="localeService.setLocale(locale)"
        >
          {{ locale.toUpperCase() }}
        </button>
      }
    </div>
  </div>
</div>
