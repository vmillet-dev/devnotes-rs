<div class="titlebar">
  <div class="titlebar-menus">
    <div class="dots" aria-hidden="true">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    </div>
    <!--
      ⚠️ Not merely disabled while the library is locked: every entry acts on it, and
      creating the component would have `SpacesStore` query a database nobody has opened
      yet. The About menu reads nothing of the library, so it stays.
    -->
    @if (vault.isUnlocked()) {
      <app-file-menu />
    }
    <app-about-menu />
  </div>

  <div class="titlebar-title" data-testid="titlebar-title">{{ title }}</div>

  <!-- ⚠️ One group, or `space-between` puts the theme in the middle of the bar: the title
       is absolutely positioned and takes no part in the flex row. -->
  <div class="titlebar-choices">
    <!-- ⚠️ One button that cycles, not three sitting side by side: the theme has three
         values and only one of them is ever true, so the other two were two-thirds of a
         control saying nothing. The glyph **is** the state, which is why the word has to
         reach a screen reader through the label.
         ⚠️ It writes `SettingsStore.theme`, the signal the preferences panel writes, so the
         two cannot disagree — and the panel keeps its row, because a setting that only
         exists in a corner of the titlebar is a setting nobody finds twice. -->
    <button
      type="button"
      class="titlebar-option theme-cycle"
      data-testid="theme-cycle"
      [attr.data-theme-choice]="settings.theme()"
      [attr.aria-label]="'settings.theme.current' | transloco: { theme: themeName() }"
      [attr.title]="'settings.theme.current' | transloco: { theme: themeName() }"
      (click)="cycleTheme()"
    >
      <span aria-hidden="true">{{ glyphs[settings.theme()] }}</span>
    </button>

    <div
      class="titlebar-switch locale-switch"
      role="group"
      [attr.aria-label]="'locale.groupLabel' | transloco"
    >
      @for (locale of locales; track locale) {
        <button
          type="button"
          class="titlebar-option locale-option"
          data-testid="locale-option"
          [attr.data-locale]="locale"
          [class.active]="locale === localeService.activeLocale()"
          [attr.aria-pressed]="locale === localeService.activeLocale()"
          [attr.aria-label]="'locale.' + locale | transloco"
          (click)="localeService.setLocale(locale)"
        >
          {{ locale.toUpperCase() }}
        </button>
      }
    </div>
  </div>
</div>
