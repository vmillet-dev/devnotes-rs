<div class="file-wrapper">
  <button
    appMenuAnchor
    type="button"
    class="file-trigger"
    data-testid="file-menu"
    aria-haspopup="menu"
    [attr.aria-expanded]="menu.open()"
    (click)="menu.toggle()"
  >
    {{ 'file.menuLabel' | transloco }}
    <span class="chev" aria-hidden="true">▾</span>
  </button>

  @if (menu.open()) {
    <div appMenuPanel class="file-dropdown">
      @for (entry of entries; track entry.id) {
        <button
          appMenuItem
          type="button"
          role="menuitem"
          class="file-option"
          data-testid="file-option"
          [attr.data-entry]="entry.id"
          [attr.aria-disabled]="entry.disabled?.() ?? false"
          (click)="run(entry)"
        >
          {{ entry.labelKey | transloco }}
        </button>
      }

      <hr class="file-separator" />

      <button
        appMenuItem
        type="button"
        role="menuitem"
        class="file-option"
        data-testid="file-libraries"
        (click)="openLibraries()"
      >
        {{ 'libraries.menuEntry' | transloco }}
      </button>

      <button
        appMenuItem
        type="button"
        role="menuitem"
        class="file-option"
        data-testid="file-preferences"
        (click)="openSettings()"
      >
        {{ 'file.preferences' | transloco }}
      </button>

      <button
        appMenuItem
        type="button"
        role="menuitem"
        class="file-option danger"
        data-testid="file-quit"
        [class.confirming]="confirmingQuit()"
        (click)="onQuit()"
      >
        {{ (confirmingQuit() ? 'file.quitConfirm' : 'file.quit') | transloco }}
      </button>
    </div>
  }
</div>

@if (librariesOpen()) {
  <app-libraries-dialog (closed)="closeLibraries()" />
}

@if (settingsOpen()) {
  <app-settings-dialog (closed)="closeSettings()" />
}
