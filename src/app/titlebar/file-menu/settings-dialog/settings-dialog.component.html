<app-dialog
  [layer]="'settings'"
  [variant]="'framed'"
  labelledBy="settings-dialog-title"
  (closed)="requestClose()"
>
  <div class="settings-header">
    <h2 id="settings-dialog-title" class="settings-title">{{ 'settings.title' | transloco }}</h2>
  </div>

  <div class="settings-body">
    <!-- A navigation rail, not a list of options: each entry changes what the right-hand
         panel shows, hence `aria-current="page"`. -->
    <nav class="settings-rail" [attr.aria-label]="'settings.pagesLabel' | transloco">
      @for (page of pages; track page.id) {
        <button
          type="button"
          class="settings-rail-option"
          data-testid="settings-page"
          [attr.data-page]="page.id"
          [class.active]="page.id === activePage().id"
          [attr.aria-current]="page.id === activePage().id ? 'page' : null"
          (click)="select(page.id)"
        >
          {{ page.labelKey | transloco }}
        </button>
      }
    </nav>

    <section class="settings-content" [attr.aria-label]="activePage().labelKey | transloco">
      <h3 class="settings-content-title">{{ activePage().labelKey | transloco }}</h3>
      <ng-container *ngComponentOutlet="activePage().component" />
    </section>
  </div>

  <!-- ⚠️ The guard replaces the buttons rather than sitting beside them: Escape and the
       backdrop produce no click, so a sentence nobody has to answer would leave the
       panel exactly as silent as it was. -->
  @if (confirmingClose()) {
    <div class="settings-actions confirming" data-testid="settings-unapplied">
      <p class="settings-warning" role="alert">
        {{ 'settings.unapplied' | transloco: { count: pendingCount() } }}
      </p>
      <div class="settings-buttons">
        <button
          type="button"
          class="settings-btn discard"
          data-testid="settings-discard"
          (click)="discardAndClose()"
        >
          {{ 'settings.closeWithout' | transloco }}
        </button>
        <button
          type="button"
          class="settings-btn primary"
          data-testid="settings-apply-close"
          (click)="applyAndClose()"
        >
          {{ 'settings.applyAndClose' | transloco }}
        </button>
      </div>
    </div>
  } @else {
    <div class="settings-actions">
      <p class="settings-hint">{{ 'settings.previewHint' | transloco }}</p>
      <div class="settings-buttons">
        <button type="button" class="settings-btn" data-testid="settings-cancel" (click)="discardAndClose()">
          {{ 'settings.cancel' | transloco }}
        </button>
        <button
          type="button"
          class="settings-btn"
          data-testid="settings-apply"
          [disabled]="!hasPending()"
          (click)="apply()"
        >
          {{ 'settings.apply' | transloco }}
        </button>
        <button
          type="button"
          class="settings-btn primary"
          data-testid="settings-close"
          (click)="applyAndClose()"
        >
          {{ 'settings.ok' | transloco }}
        </button>
      </div>
    </div>
  }
</app-dialog>
