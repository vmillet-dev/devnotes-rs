@let here = current();

<button
  appMenuAnchor
  type="button"
  class="placement-trigger"
  [attr.data-testid]="'editor-placement-' + kind()"
  aria-haspopup="menu"
  [attr.aria-expanded]="menu.open()"
  [attr.aria-label]="label()"
  [attr.title]="label()"
  (click)="menu.toggle()"
>
  @if (here?.colour; as colour) {
    <i [class]="'placement-swatch is-' + colour" aria-hidden="true"></i>
  }
  <span class="placement-name">{{ here?.name ?? noneLabel() ?? label() }}</span>
  <span class="placement-caret" aria-hidden="true">▾</span>
</button>

@if (menu.open()) {
  <div appMenuPanel class="placement-menu" [attr.data-testid]="'editor-placement-panel-' + kind()">
    @if (noneLabel(); as none) {
      <button
        appMenuItem
        type="button"
        role="menuitem"
        class="placement-item"
        data-testid="editor-placement-none"
        (click)="pick(null)"
      >
        {{ none }}
      </button>
    }
    @for (option of options(); track option.id) {
      <button
        appMenuItem
        type="button"
        role="menuitem"
        class="placement-item"
        data-testid="editor-placement-option"
        [attr.data-option-id]="option.id"
        [class.on]="option.id === currentId()"
        (click)="pick(option.id)"
      >
        @if (option.colour; as colour) {
          <i [class]="'placement-swatch is-' + colour" aria-hidden="true"></i>
        }
        {{ option.name }}
      </button>
    }
  </div>
}
