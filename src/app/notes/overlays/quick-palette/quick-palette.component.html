<app-dialog [layer]="'palette'" labelledBy="palette-title" (closed)="closed.emit()">
  <h2 id="palette-title" class="visually-hidden">{{ 'palette.title' | transloco }}</h2>

  <input
    #searchInput
    type="text"
    class="palette-input"
    data-testid="palette-input"
    role="combobox"
    aria-expanded="true"
    aria-controls="palette-results"
    autocomplete="off"
    [attr.aria-activedescendant]="results().length ? optionId(highlighted()) : null"
    [attr.aria-label]="'palette.searchLabel' | transloco"
    [placeholder]="'palette.placeholder' | transloco"
    [value]="query()"
    (input)="queryChanged.emit(searchInput.value)"
    (keydown)="onKeydown($event)"
  />

  <ul
    id="palette-results"
    class="palette-results"
    role="listbox"
    [attr.aria-label]="'palette.resultsLabel' | transloco"
  >
    @for (note of results(); track note.id; let index = $index) {
      <li
        class="palette-option"
        data-testid="palette-option"
        [attr.data-note-id]="note.id"
        role="option"
        [id]="optionId(index)"
        [class.highlighted]="index === highlighted()"
        [attr.aria-selected]="index === highlighted()"
      >
        <!-- A click **opens** the note, and so does Enter: that is what both mean
             everywhere else in the application. Copying has its own control beside it, and
             Ctrl+C on the keyboard. The keyboard goes through the field, which never loses
             focus. -->
        <button
          type="button"
          class="palette-option-button"
          data-testid="palette-open"
          tabindex="-1"
          (click)="highlightSet.emit(index); openRequested.emit(note)"
        >
          <span class="palette-option-head">
            <app-language-badge [language]="note.language" />
            <span class="palette-option-title">
              {{ note.title || ('notes.untitled' | transloco) }}
            </span>
            @if (note.placeholders.length > 0) {
              <span class="palette-option-fields">
                {{ 'notes.placeholdersCount' | transloco: { count: note.placeholders.length } }}
              </span>
            }
          </span>
          <span class="palette-option-snippet">{{ snippetOf(note) }}</span>
        </button>

        <!-- The paste path with a mouse: copies and puts the window away, which is what
             Ctrl+C does. A snippet with fields still goes through the form first. -->
        <button
          type="button"
          class="palette-option-copy"
          data-testid="palette-copy"
          tabindex="-1"
          [attr.aria-label]="
            'palette.copyLabel' | transloco: { title: note.title || ('notes.untitled' | transloco) }
          "
          [attr.title]="
            'palette.copyLabel' | transloco: { title: note.title || ('notes.untitled' | transloco) }
          "
          (click)="highlightSet.emit(index); chosen.emit()"
        >
          <span aria-hidden="true">⧉</span>
        </button>
      </li>
    }

    <!-- After the results: finding a snippet stays the most frequent gesture. -->
    @if (canCreate()) {
      <li
        class="palette-option palette-create"
        data-testid="palette-create"
        role="option"
        [id]="optionId(results().length)"
        [class.highlighted]="highlighted() === results().length"
        [attr.aria-selected]="highlighted() === results().length"
      >
        <button
          type="button"
          class="palette-option-button"
          tabindex="-1"
          (click)="highlightSet.emit(results().length); chosen.emit()"
        >
          <span class="palette-option-title">
            {{ 'palette.createNote' | transloco: { query: query() } }}
          </span>
        </button>
      </li>
    } @else if (results().length === 0) {
      <li class="palette-empty" data-testid="palette-empty">{{ 'palette.empty' | transloco }}</li>
    }
  </ul>

  <p class="palette-hint">{{ 'palette.hint' | transloco }}</p>
</app-dialog>
