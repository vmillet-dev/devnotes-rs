<!-- A non-interactive tag is a plain label: a button role would announce an action that
     does not exist. -->
@if (interactive()) {
  <button
    type="button"
    class="tag-pill"
    data-testid="tag-pill"
    [attr.data-tag]="label()"
    [class.on]="active()"
    [attr.aria-pressed]="active()"
    (click)="onClick()"
  >
    #{{ label() }}
    @if (count(); as count) {
      <span class="tag-count" data-testid="tag-count">{{ count }}</span>
    }
  </button>
} @else {
  <span class="tag-pill static">#{{ label() }}</span>
}
