<button
  type="button"
  class="copy-btn"
  data-testid="copy-button"
  [class.with-label]="showLabel()"
  [class.copied]="copied()"
  [attr.aria-label]="label() | transloco"
  (click)="onCopy($event)"
>
  <span aria-hidden="true">{{ copied() ? '✓' : '⧉' }}</span>
  @if (showLabel()) {
    <span class="copy-label" aria-hidden="true">{{ (copied() ? 'notes.copied' : label()) | transloco }}</span>
  }
  <!-- Without this announced twin, a screen reader would not know the copy happened. -->
  <span class="visually-hidden" role="status">
    @if (copied()) {
      {{ 'notes.copied' | transloco }}
    }
  </span>
</button>
