<div class="view-switch" role="group" [attr.aria-label]="'board.viewSwitchLabel' | transloco">
  <button
    type="button"
    class="view-option"
    data-testid="view-list"
    [class.on]="mode() === 'list'"
    [attr.aria-pressed]="mode() === 'list'"
    (click)="modeChanged.emit('list')"
  >
    {{ 'board.listView' | transloco }}
  </button>
  <!-- Disabled rather than hidden: a control that vanishes on "all spaces" reads as a
       bug, where a disabled one with a reason reads as an explanation. -->
  <button
    type="button"
    class="view-option"
    data-testid="view-board"
    [class.on]="mode() === 'board'"
    [disabled]="!boardAvailable()"
    [attr.aria-pressed]="mode() === 'board'"
    [attr.title]="boardAvailable() ? null : ('board.needsASpace' | transloco)"
    (click)="modeChanged.emit('board')"
  >
    {{ 'board.boardView' | transloco }}
  </button>
</div>
