<div class="crumb-wrapper">
  <nav
    class="crumb"
    data-testid="folder-breadcrumb"
    [attr.aria-label]="'folders.breadcrumbLabel' | transloco"
  >
    <button type="button" class="crumb-back" data-testid="folder-breadcrumb-back" (click)="closed.emit()">
      <span aria-hidden="true">‹</span>
      {{ spaceName() ?? ('notes.allSpaces' | transloco) }}
    </button>
    <span class="crumb-sep" aria-hidden="true">/</span>
    <i class="crumb-swatch" [class]="'crumb-swatch is-' + folder().colour" aria-hidden="true"></i>
    <span class="crumb-here" data-testid="folder-breadcrumb-name" aria-current="page">{{
      folder().name
    }}</span>
  </nav>

  <button
    appMenuAnchor
    type="button"
    class="crumb-menu"
    data-testid="folder-breadcrumb-menu"
    aria-haspopup="menu"
    [attr.aria-expanded]="menu.open()"
    [attr.aria-label]="'folders.optionsLabel' | transloco: { name: folder().name }"
    [attr.title]="'folders.optionsLabel' | transloco: { name: folder().name }"
    (click)="menu.toggle()"
  >
    <span aria-hidden="true">⋯</span>
  </button>

  @if (menu.open()) {
    <div appMenuPanel class="crumb-dropdown" data-testid="folder-breadcrumb-panel">
      <app-folder-editor
        [folder]="folder()"
        [selectableCount]="selectableCount()"
        (finished)="menu.close()"
        (selectRequested)="onSelectRequested($event)"
      />
    </div>
  }
</div>
