<div
  class="selection-bar"
  data-testid="selection-bar"
  role="group"
  [attr.aria-label]="'selection.label' | transloco"
>
  <span class="selection-count" data-testid="selection-count">{{
    'selection.count' | transloco: { count: count() }
  }}</span>

  <!-- Menus, not fields. These are **commands**: they reset their own value after every
       `change`, so a screen reader announced a combobox whose current value was "Ranger
       dans" — a listbox where the rest of the application gives a menu. `naming: 'label'`
       is what says a control names what it does rather than what is chosen. -->
  @if (spaces().length > 0) {
    <app-choice-menu
      [kind]="'selection-move'"
      [naming]="'label'"
      [label]="'selection.moveTo' | transloco"
      [options]="spaceChoices()"
      (chosen)="onMove($event)"
    />
  }

  @if (folders().length > 0) {
    <app-choice-menu
      [kind]="'selection-file'"
      [naming]="'label'"
      [label]="'selection.fileInto' | transloco"
      [options]="folderChoices()"
      (chosen)="onFile($event)"
    />
  }

  <form class="selection-tag-form" (submit)="submitTag($event)">
    <input
      #tagInput
      type="text"
      class="selection-tag-input"
      data-testid="selection-tag"
      [attr.aria-label]="'selection.addTagLabel' | transloco"
      [placeholder]="'selection.addTagPlaceholder' | transloco"
      [value]="tagDraft()"
      (input)="tagDraft.set(tagInput.value)"
    />
  </form>

  <button type="button" class="selection-action" data-testid="selection-copy" (click)="copyRequested.emit()">
    {{ 'file.copyMarkdown' | transloco }}
  </button>

  <button
    type="button"
    class="selection-action danger"
    data-testid="selection-delete"
    [class.confirming]="confirmingDelete()"
    (click)="onDeleteClick()"
  >
    {{ (confirmingDelete() ? 'selection.deleteConfirm' : 'selection.delete') | transloco }}
  </button>

  <button
    type="button"
    class="selection-clear"
    data-testid="selection-clear"
    [attr.aria-label]="'selection.clear' | transloco"
    [attr.title]="'selection.clear' | transloco"
    (click)="cleared.emit()"
  >
    <span aria-hidden="true">✕</span>
  </button>
</div>
