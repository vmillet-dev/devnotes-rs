<div class="folder-switch-wrapper">
  <button
    appMenuAnchor
    type="button"
    class="folder-switch"
    data-testid="folder-switcher"
    aria-haspopup="menu"
    [class.narrowed]="activeFolder() !== null"
    [attr.aria-expanded]="menu.open()"
    [attr.aria-label]="'folders.switcherLabel' | transloco"
    (click)="toggle()"
  >
    @if (activeFolder(); as folder) {
      <i class="folder-swatch" [class]="'is-' + folder.colour" aria-hidden="true"></i>
    } @else {
      <span class="folder-icon" aria-hidden="true">▭</span>
    }
    {{ activeFolder()?.name ?? ('folders.allFolders' | transloco) }}
    <span class="chev" aria-hidden="true">▾</span>
  </button>
  @if (menu.open()) {
    <div class="folder-dropdown" data-testid="folder-dropdown">
      @if (editing(); as edited) {
        <!-- The edit panel replaces the menu, like the create form. -->
        <app-folder-editor [folder]="edited" (finished)="menu.close()" />
      } @else if (creating()) {
        <!-- The form replaces the menu rather than adding to it: an input inside a
             role="menu" is neither valid ARIA nor navigable the way options are. -->
        <form class="folder-create-form" (submit)="submitNewFolder($event, nameInput.value)">
          <input
            #nameInput
            type="text"
            class="folder-create-input"
            data-testid="folder-create-input"
            [attr.aria-label]="'folders.newFolderLabel' | transloco"
            [placeholder]="'folders.newFolderPlaceholder' | transloco"
          />
          <button type="submit" class="folder-create-submit" data-testid="folder-create-submit">
            {{ 'folders.newFolderSubmit' | transloco }}
          </button>
        </form>
      } @else {
        <div appMenuPanel class="folder-menu">
          <button
            appMenuItem
            type="button"
            role="menuitemradio"
            class="folder-option"
            data-testid="folder-option-all"
            [class.active]="activeFolder() === null"
            [attr.aria-checked]="activeFolder() === null"
            (click)="select(null)"
          >
            {{ 'folders.allFolders' | transloco }}
          </button>
          @for (folder of folders(); track folder.id) {
            <!-- `role="none"`: a bare container between the menu and its items would
                 break the relationship screen readers expect. -->
            <div class="folder-row" role="none">
              <button
                appMenuItem
                type="button"
                role="menuitemradio"
                class="folder-option"
                data-testid="folder-option"
                [attr.data-folder-id]="folder.id"
                [class.active]="folder.id === activeFolder()?.id"
                [attr.aria-checked]="folder.id === activeFolder()?.id"
                (click)="select(folder)"
              >
                <i class="folder-swatch" [class]="'folder-swatch is-' + folder.colour" aria-hidden="true"></i>
                {{ folder.name }}
              </button>
              <button
                type="button"
                role="menuitem"
                class="folder-edit-trigger"
                data-testid="folder-edit"
                [attr.data-folder-id]="folder.id"
                [attr.aria-label]="'folders.optionsLabel' | transloco: { name: folder.name }"
                [attr.title]="'folders.optionsLabel' | transloco: { name: folder.name }"
                (click)="startEditing(folder)"
              >
                <span aria-hidden="true">⋯</span>
              </button>
            </div>
          }
          @if (canCreate()) {
            <button
              appMenuItem
              type="button"
              role="menuitem"
              class="folder-option folder-create-trigger"
              data-testid="folder-create-open"
              (click)="startCreating()"
            >
              <span aria-hidden="true">＋</span> {{ 'folders.newFolder' | transloco }}
            </button>
          } @else {
            <p class="folder-create-blocked" data-testid="folder-create-blocked">
              {{ 'folders.needsASpace' | transloco }}
            </p>
          }
        </div>
      }
    </div>
  }
</div>
