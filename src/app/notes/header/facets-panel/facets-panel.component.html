<div class="facets-panel" id="facets-panel" data-testid="facets-panel">
  <app-tag-rail
    [tags]="tags()"
    [activeTags]="activeTags()"
    (tagToggled)="tagToggled.emit($event)"
    (manageRequested)="manageRequested.emit()"
  />

  <app-language-rail
    [languages]="languages()"
    [activeLanguages]="activeLanguages()"
    (languageToggled)="languageToggled.emit($event)"
  />

  <!-- Here rather than in the topbar: the panel is open exactly when something is
       filtering, which is exactly when this is worth a place. -->
  @if (canClear()) {
    <button type="button" class="facets-clear" data-testid="clear-filters" (click)="clearRequested.emit()">
      <span aria-hidden="true">✕</span>
      {{ 'notes.clearFilters' | transloco }}
    </button>
  }
</div>
