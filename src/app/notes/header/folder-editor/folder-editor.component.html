<div class="editor-panel">
  <p class="editor-title">{{ folder().name }}</p>

  <div class="editor-colours" role="radiogroup" [attr.aria-label]="'folders.colourLabel' | transloco">
    @for (colour of colours; track colour) {
      <button
        type="button"
        role="radio"
        data-testid="folder-colour"
        [attr.data-colour]="colour"
        [class]="'editor-colour is-' + colour"
        [class.on]="folder().colour === colour"
        [attr.aria-checked]="folder().colour === colour"
        [attr.aria-label]="'folders.colour.' + colour | transloco"
        [attr.title]="'folders.colour.' + colour | transloco"
        (click)="pickColour(colour)"
      ></button>
    }
  </div>

  <form class="editor-form" (submit)="submitRename($event, renameInput.value)">
    <input
      #renameInput
      type="text"
      class="editor-input"
      data-testid="folder-rename-input"
      [attr.aria-label]="'folders.renameLabel' | transloco"
      [value]="folder().name"
    />
    <button type="submit" class="editor-action" data-testid="folder-rename-submit">
      {{ 'folders.renameSubmit' | transloco }}
    </button>
  </form>

  <!-- ⚠️ Named with its count, so it says what it will tick before it ticks it. Absent
       from the switcher, where the folder's notes are not on screen to be selected. -->
  @if (selectableCount(); as count) {
    <button type="button" class="editor-action" data-testid="folder-select-notes" (click)="selectNotes()">
      {{ 'folders.selectNotes' | transloco: { count } }}
    </button>
  }

  <!-- ⚠️ No refuge to choose, unlike a space: `ON DELETE SET NULL` leaves the notes where
       they are, merely unfiled. -->
  <button
    type="button"
    class="editor-action editor-delete"
    data-testid="folder-delete"
    [class.confirming]="confirmingDelete()"
    (click)="onDeleteClick()"
  >
    {{ (confirmingDelete() ? 'folders.deleteConfirm' : 'folders.delete') | transloco }}
  </button>
  <p class="editor-note">{{ 'folders.deleteKeepsNotes' | transloco }}</p>
</div>
