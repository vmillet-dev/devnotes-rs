<!-- The long form is a tooltip and not the placeholder. The row wraps before the
     window is narrow, so the field spends most of its life at its 220px floor and the
     sentence was cut mid-word; a wider field only makes the row wrap sooner. -->
<label class="search-bar" [attr.title]="'notes.searchHint' | transloco">
  <!-- Hidden from assistive technology: a <label> aggregates all its text content, and
       the field's accessible name would become "🔍 Ctrl+K". -->
  <span aria-hidden="true">🔍</span>
  <input
    #searchInput
    type="search"
    data-testid="search-input"
    [attr.aria-label]="'notes.searchLabel' | transloco"
    [placeholder]="'notes.searchPlaceholder' | transloco"
    [value]="query()"
    (input)="onInput(searchInput.value)"
  />
  <!-- Empties the field and nothing else, as a cross in a search field does everywhere.
       Clearing every filter has its own button in the row. -->
  @if (query()) {
    <button
      type="button"
      class="clear-text"
      data-testid="search-clear"
      [attr.aria-label]="'notes.clearSearch' | transloco"
      [attr.title]="'notes.clearSearch' | transloco"
      (click)="onClearText($event)"
    >
      <span aria-hidden="true">✕</span>
    </button>
  }
  <!-- `!== null` and not a truthiness check: zero results is the answer that matters most. -->
  @if (matched() !== null) {
    <span class="count" data-testid="search-matched">
      {{ 'notes.searchMatched' | transloco: { count: matched() } }}
    </span>
  } @else {
    <span class="kbd" aria-hidden="true">{{ shortcutHint }}</span>
  }
</label>
