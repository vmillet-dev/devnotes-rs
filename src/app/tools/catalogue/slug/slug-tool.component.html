<div class="columns">
  <section class="column" aria-labelledby="slug-input-title">
    <h2 id="slug-input-title" class="section-title">{{ 'tools.input' | transloco }}</h2>
    <label class="field">
      <span class="visually-hidden">{{ 'tools.slug.inputLabel' | transloco }}</span>
      <textarea
        class="text"
        data-testid="slug-input"
        rows="3"
        [value]="text()"
        [placeholder]="'tools.slug.placeholder' | transloco"
        (input)="onInput($event)"
      ></textarea>
    </label>

    <div class="options">
      <app-segmented-choice
        kind="slug-separator"
        [label]="'tools.slug.separator' | transloco"
        [segments]="separators"
        [currentId]="separator()"
        (chosen)="onSeparator($event)"
      />
      <label class="check">
        <input
          type="checkbox"
          data-testid="slug-lowercase"
          [checked]="lowercase()"
          (change)="onLowercase($event)"
        />
        {{ 'tools.slug.lowercase' | transloco }}
      </label>
    </div>
  </section>

  <section class="column" aria-labelledby="slug-output-title">
    <h2 id="slug-output-title" class="section-title">{{ 'tools.result' | transloco }}</h2>
    @if (slug.value(); as value) {
      <app-output-row name="Slug" [value]="value" />
    } @else {
      <p class="empty">{{ 'tools.slug.empty' | transloco }}</p>
    }
  </section>
</div>
