<app-segmented-choice
  kind="diff-mode"
  [label]="'tools.diff.mode' | transloco"
  [segments]="modes"
  [currentId]="mode()"
  (chosen)="onMode($event)"
/>

@if (mode() === 'text') {
  <app-text-diff (asValues)="mode.set('structured')" />
} @else {
  <!-- « Données » alone does not say what is compared: the line under the tabs does. -->
  <p class="what" data-testid="diff-data-line">{{ 'tools.diff.dataLine' | transloco }}</p>
  <app-structured-diff (asText)="mode.set('text')" />
}
