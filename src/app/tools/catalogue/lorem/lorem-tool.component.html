<div class="options">
  <app-segmented-choice
    kind="lorem-unit"
    [label]="'tools.lorem.unit' | transloco"
    [segments]="units"
    [currentId]="unit()"
    (chosen)="onUnit($event)"
  />
  <label class="option">
    {{ 'tools.lorem.count' | transloco }}
    <input
      type="number"
      class="number"
      data-testid="lorem-count"
      min="1"
      max="5000"
      [value]="count()"
      (input)="onCount($event)"
    />
  </label>
  <label class="check">
    <input type="checkbox" data-testid="lorem-opening" [checked]="opening()" (change)="onOpening($event)" />
    {{ 'tools.lorem.opening' | transloco }}
  </label>
  <span class="spacer"></span>
  @if (answer.value(); as answer) {
    <app-copy-value [value]="answer.text" what="Lorem ipsum" />
  }
</div>

<div class="text" data-testid="lorem-output">
  @for (paragraph of paragraphs(); track $index) {
    <p>{{ paragraph }}</p>
  }
</div>
