@let id = tool().id;
<header class="topbar">
  <app-rail-toggle
    testId="tools-rail-toggle"
    [shown]="settings.showLibraryRail()"
    (toggled)="settings.toggleLibraryRail()"
  />
  <button type="button" class="crumb" data-testid="tool-back" (click)="store.home()">
    {{ 'tools.title' | transloco }} <span aria-hidden="true">›</span>
  </button>
  <h1 class="title" data-testid="tool-title">{{ 'tools.' + id + '.name' | transloco }}</h1>
  @let starred = store.favourites().includes(id);
  <button
    type="button"
    class="star"
    data-testid="tool-favourite"
    [class.on]="starred"
    [attr.aria-pressed]="starred"
    [attr.aria-label]="'tools.favourites.toggle' | transloco"
    [attr.title]="(starred ? 'tools.favourites.remove' : 'tools.favourites.add') | transloco"
    (click)="store.toggleFavourite(id)"
  >
    <app-icon name="star" [filled]="starred" />
  </button>
  <span class="spacer"></span>
  @for (action of actions(); track action.id) {
    <button
      type="button"
      class="action"
      [attr.data-testid]="'tool-action-' + action.id"
      [disabled]="action.disabled"
      (click)="action.run()"
    >
      {{ action.labelKey | transloco }}
    </button>
  }
  @if (hasSample()) {
    <button type="button" class="action" data-testid="tool-sample" (click)="sample()">
      {{ 'tools.sample' | transloco }}
    </button>
  }
  <button type="button" class="action" data-testid="tool-clear" (click)="clear()">
    {{ 'tools.clear' | transloco }}
  </button>
  @if (keepsResult()) {
    <button
      type="button"
      class="action primary"
      data-testid="tool-save-as-note"
      [attr.aria-disabled]="result() === null"
      [attr.title]="result() === null ? ('tools.saveAsNote.nothing' | transloco) : null"
      (click)="saveAsNote()"
    >
      {{ 'tools.saveAsNote.open' | transloco }}
    </button>
  }
</header>

<div class="body" data-testid="tool-body" [attr.data-tool]="id">
  <ng-container #host />
</div>

@if (saving(); as result) {
  <app-save-as-note-dialog
    [result]="result"
    [source]="('tools.title' | transloco) + ' / ' + ('tools.' + id + '.name' | transloco)"
    (closed)="saving.set(null)"
  />
}
