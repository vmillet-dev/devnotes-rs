# Toolchain épinglée : la CI prenait `@stable`, qui bouge sous les pieds et fait
# apparaître des lints clippy d'un jour à l'autre sans qu'aucun commit n'ait bougé.
# La relever est un commit délibéré.
#
# À la racine : rustup résout ce fichier depuis le répertoire courant en remontant, et
# chaque crate du workspace le trouve ainsi.
[toolchain]
channel = "1.97.1"
components = ["clippy", "rustfmt"]
