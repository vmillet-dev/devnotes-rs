[package]
name = "devnotes"
version = "0.4.0"
description = "A developer's notes and snippets manager for the desktop"
authors = ["Valentin MILLET"]
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/vmillet-dev/devnotes-rs"
license = "GPL-3.0-only"
readme = "../README.md"
default-run = "devnotes"
autobenches = false

[package.metadata.devnotes]
display-name = "DevNotes"
author-handle = "@vmillet-dev"

[lib]
name = "devnotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
bench = false

[[bin]]
name = "devnotes"
path = "src/main.rs"
bench = false

[[bin]]
name = "export-bindings"
path = "src/bin/export-bindings.rs"
bench = false

[features]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
toml = "1.1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["chrono"] }
specta-typescript = "=0.0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
diesel = { version = "2.3.12", features = ["sqlite"] }
diesel_migrations = { version = "2.3.2", features = ["sqlite"] }
libsqlite3-sys = { version = "0.38.1", features = ["bundled"] }
uuid = { version = "1.24.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
base64 = "0.23.1"
png = "0.18.1"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
log = "0.4"
thiserror = "2.0.20"
unicode-normalization = "0.1.25"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
aes-gcm = "0.11.1"
argon2 = "0.6.0"
zeroize = "1.9.0"
getrandom = "0.3"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "commands"
harness = false

# ⚠️ Its own target so `cargo bench` stays usable: it seeds 26 000 notes.
[[bench]]
name = "corpus_size"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
