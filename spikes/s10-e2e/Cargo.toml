[package]
name = "s10-e2e"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[features]
# The `e2e` flavour: eframe's inspection server, never in a release build.
e2e = ["eframe/inspection"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "x11"] }
egui_inspection = "0.37"
egui = { version = "0.37", features = ["serde"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
