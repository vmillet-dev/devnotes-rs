[package]
name = "s5-highlight"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[features]
fancy = ["two-face/syntect-default-fancy"]
onig = ["two-face/syntect-default-onig"]

[dependencies]
two-face = { version = "0.5", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["parsing"] }
