[package]
name = "s1-shell"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"] }
interprocess = "2"
tray-icon = "0.21"
global-hotkey = "0.7"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
