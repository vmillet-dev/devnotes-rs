[package]
name = "s9-packages"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"
description = "S9 spike: an app that updates itself"

[[bin]]
name = "devnotes-s9"
path = "src/main.rs"

[dependencies]
cargo-packager-updater = "0.2"
semver = "1"

[package.metadata.packager]
product-name = "DevNotes S9"
identifier = "com.devnotes.app.s9"
publisher = "DevNotes"
formats = ["deb", "appimage"]
before-packaging-command = "cargo build --release -p s9-packages"
out-dir = "../out/s9/packages"
binaries = [{ path = "devnotes-s9", main = true }]
resources = ["resources/identity"]

[package.metadata.packager.nsis]
installer-mode = "currentUser"

[package.metadata.generate-rpm]
assets = [
  { source = "../target/release/devnotes-s9", dest = "/usr/bin/devnotes-s9", mode = "755" },
  { source = "resources/identity/names.txt", dest = "/usr/lib/devnotes-s9/identity/names.txt", mode = "644" },
]
