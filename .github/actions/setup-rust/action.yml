name: Setup Rust
description: What egui loads at run time, Rust toolchain and a cargo cache shared between jobs.

inputs:
  shared-key:
    description: Cargo cache key. One per job that compiles — a job reading another's finds none of its own artifacts.
    required: true
  save-if:
    description: "'true' for the job that owns the key. Honoured on main alone."
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # Nothing to link: Wayland, X11, xkbcommon and fontconfig are opened at run time. What
    # kittest draws on is, a software Vulkan (lavapipe); Windows has WARP.
    - name: Software Vulkan and xkbcommon
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libvulkan1 libxkbcommon-x11-0 mesa-vulkan-drivers

    # Read from `rust-toolchain.toml` rather than written here: two places would end up
    # diverging, and drift is precisely what pinning avoids.
    - name: Toolchain version
      id: toolchain
      shell: bash
      run: |
        channel=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
        echo "Pinned toolchain: $channel"

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        components: clippy, rustfmt

    # Line tables, not full debug info: a backtrace still names its files and lines, and the
    # dependencies' artifacts — what the cache holds — come to a third less (the e2e build:
    # 3.6 GB down to 2.4). Before the cache step, whose key hashes the `CARGO_*` variables.
    # The release profile carries no debug info either way.
    - name: Debug info
      shell: bash
      run: echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"

    # ⚠️ Saved from main alone, in a quota of ten gigabytes at about one per key: a version
    # branch saving its own copy of every key had GitHub evict main's Windows E2E entry, and
    # every pull request then built it from nothing. A pull request or a `dev/**` push reads
    # main's entry instead — whole when Cargo.lock matches, by prefix when it moved.
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.shared-key }}
        save-if: ${{ inputs.save-if == 'true' && github.ref == 'refs/heads/main' }}
