name: Setup Rust
description: What egui loads at run time, Rust toolchain and a cargo cache shared between jobs.

inputs:
  shared-key:
    description: Cargo cache key. One per job that compiles — a job reading another's finds none of its own artifacts.
    required: true
  save-if:
    description: "'true' for the job that owns the key. Honoured on main alone."
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # GTK is the tray's, the one library linked. Wayland, X11, xkbcommon and fontconfig are opened
    # at run time. What kittest draws on is, a software Vulkan (lavapipe); Windows has WARP.
    - name: GTK, software Vulkan and xkbcommon
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgtk-3-dev libvulkan1 libxkbcommon-x11-0 mesa-vulkan-drivers

    # Read from `rust-toolchain.toml` rather than written here: two places would end up
    # diverging, and drift is precisely what pinning avoids.
    - name: Toolchain version
      id: toolchain
      shell: bash
      run: |
        channel=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
        echo "Pinned toolchain: $channel"

    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        components: clippy, rustfmt

    # Line tables, not full debug info: a backtrace still names its files and lines, and the
    # dependencies' artifacts — what the cache holds — come to a third less (the e2e build:
    # 3.6 GB down to 2.4). Before the cache step, whose key hashes the `CARGO_*` variables.
    # The release profile carries no debug info either way.
    - name: Debug info
      shell: bash
      run: echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"

    # The key holds the job, the OS, the `CARGO_*` variables and a hash of Cargo.lock, every
    # Cargo.toml and the toolchain. Saved by a push to main or to a milestone branch, never by a
    # pull request: a pull request reads its base branch's entry, then main's — whole when
    # Cargo.lock matches, by prefix when it moved. ⚠️ A quota of ten gigabytes, about one per
    # key and branch: two branches' five keys fit, and a merged milestone's are evicted first.
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        shared-key: ${{ inputs.shared-key }}
        save-if: ${{ inputs.save-if == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev/')) }}
