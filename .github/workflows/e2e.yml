name: E2E

# One platform's end-to-end run: its binary, then its groups of scenarios against it. `ci.yml`
# calls it once per platform, so the groups of one start as soon as its own binary is ready — a
# matrix of builds would hold them until the slower platform had built too.
on:
  workflow_call:
    inputs:
      os:
        description: The runner image, `windows-latest` or `ubuntu-22.04`.
        required: true
        type: string
      groups:
        description: The groups of `e2e/groups.json`, as a JSON array of name and specs.
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The action's apt step installs the Tauri dependencies on Linux; on Windows it only
      # lays down the toolchain and the cargo cache.
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: e2e-${{ inputs.os }}
          save-if: 'true'

      - run: npm ci

      # `tauri build` chains `beforeBuildCommand` (the e2e front-end build) then cargo, and the
      # front end is embedded in the binary. It carries the `com.devnotes.app.e2e` identifier,
      # so its profile is its own: it cannot overwrite an existing library.
      - name: Build the e2e binary
        run: |
          start=$(date +%s)
          npm run e2e:build
          echo "\`build-e2e\` (${{ inputs.os }}) — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

      # What the binary needs beside it, laid out as cargo left it. `identity/` is the identity
      # tool's resource, copied there by `tauri-build`. ⚠️ On Linux, Tauri reads resources next
      # to the executable only in a `target/<profile>` holding `.cargo-lock`; anywhere else it
      # looks in `/usr/lib/devnotes`, and the identity tool answers that its lists are missing.
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-app-${{ inputs.os }}
          path: |
            src-tauri/target/debug/${{ runner.os == 'Windows' && 'devnotes.exe' || 'devnotes' }}
            src-tauri/target/debug/identity/
            src-tauri/target/debug/.cargo-lock
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # No cargo here: the binary comes from `build`. A group is a runner that sets up once and runs
  # its scenarios one after the other, each its own process, profile and logs: nothing in one
  # scenario depends on the one before it.
  group:
    name: group ${{ matrix.group.name }}
    needs: build
    runs-on: ${{ inputs.os }}
    timeout-minutes: 40
    strategy:
      # The first failure cancels this platform's other groups: the run's result is known.
      fail-fast: true
      # Three runners per platform and pull request, whatever the account could give: several
      # pull requests open at once then share the runners instead of queuing behind one.
      max-parallel: 3
      matrix:
        group: ${{ fromJSON(inputs.groups) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # What the binary loads, not what builds it. WebKitGTK needs an X server: without one the
      # window never opens and the embedded WebDriver server never listens.
      - name: WebView and X server
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-1 libwebkit2gtk-4.1-0 libxdo3 xvfb

      # WebdriverIO and the harness.
      - run: npm ci

      # Where `e2e/wdio.conf.ts` looks for it. An artifact keeps no file mode.
      - uses: actions/download-artifact@v8
        with:
          name: e2e-app-${{ inputs.os }}
          path: src-tauri/target/debug

      - name: Executable bit
        if: runner.os == 'Linux'
        run: chmod +x src-tauri/target/debug/devnotes

      # One `npm run test:e2e` per scenario, which stops any application left running and wipes
      # the profile first: each starts as virgin as it would on a runner of its own. The group
      # stops at its first failure. `xvfb-run` wraps the runner, not the binary: the wdio service
      # is what launches the application, from its own `onPrepare`, so DISPLAY has to exist for
      # the whole process.
      - name: Run group ${{ matrix.group.name }}
        env:
          SPECS: ${{ join(matrix.group.specs, ' ') }}
        run: |
          for spec in $SPECS; do
            echo "::group::$spec"
            start=$(date +%s)
            status=0
            if [ "$RUNNER_OS" = "Linux" ]; then
              E2E_SPEC=$spec xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npm run test:e2e || status=$?
            else
              E2E_SPEC=$spec npm run test:e2e || status=$?
            fi
            echo "::endgroup::"
            if [ -d e2e/logs ]; then
              mkdir -p e2e/logs-of
              mv e2e/logs "e2e/logs-of/$spec"
            fi
            if [ "$status" -ne 0 ]; then
              echo "::error title=E2E::$spec failed (${{ inputs.os }}, group ${{ matrix.group.name }})"
              echo "\`$spec\` (${{ inputs.os }}) — failed after $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"
              exit "$status"
            fi
            echo "\`$spec\` (${{ inputs.os }}) — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"
          done

      # The runner's log, the application's Rust log, and for each failed test a screenshot plus
      # what was on screen, the page's console included — never the profile, whose library is
      # the run's. One folder per scenario under `logs-of/`; `logs/` is the scenario a timeout cut
      # short. `E2E_LOG_LEVEL=trace` by hand when a session refuses to open. Named per attempt: a
      # re-run that passes would otherwise replace the logs of the attempt that failed.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-logs-${{ inputs.os }}-group-${{ matrix.group.name }}-${{ github.run_attempt }}
          path: |
            e2e/logs-of
            e2e/logs
          if-no-files-found: ignore
          retention-days: 7
