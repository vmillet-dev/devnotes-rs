name: CI

# A milestone's work merges into its `dev/x.y.z` branch first, then into main: both are checked alike.
on:
  push:
    branches: [main, 'dev/**']
  pull_request:
    branches: [main, 'dev/**']

# Stacked runs on a branch are cancelled. No tag run to spare any more: publishing lives
# in `release.yml`, which has a concurrency group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-front:
    name: Lint front
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # ESLint (template accessibility rules included) plus the Prettier check, which also
      # covers this workflow file.
      - run: npm run lint

      # The release-notes generator is neither Angular nor Rust: its runner is Node's own,
      # with no dependency to install.
      - run: npm run test:scripts

  lint-rust:
    name: Lint Rust
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # ⚠️ A key of its own: a cache entry has one writer and never changes afterwards, and
      # Clippy's check artifacts are in nobody else's build.
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: lint-ubuntu-22.04
          save-if: 'true'

      # `generate_context!` reads frontendDist at compile time. Making this job depend on the
      # front-end build would serialise it for nothing: it validates Rust, not the bundle.
      - name: Placeholder frontendDist
        run: |
          mkdir -p dist/devnotes/browser
          printf '<!doctype html><title>ci</title>' > dist/devnotes/browser/index.html

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # `--all-features` is what type-checks the `e2e` feature. Without it a break in
      # the end-to-end harness only surfaces at the next `npm run e2e:build`.
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings

  build-front:
    name: Build front
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: |
          start=$(date +%s)
          npm run build
          echo "\`build-front\` — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

      # Not consumed by `test-front`: angular.json's `test` target rebuilds its own dev build
      # (buildTarget "::development"). Kept short, as evidence and for debugging.
      - uses: actions/upload-artifact@v7
        with:
          name: front-dist
          path: dist/devnotes/browser
          retention-days: 1

  test-front:
    name: Test front
    needs: build-front
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The 80% coverage thresholds are the guard.
      - name: Test
        run: |
          start=$(date +%s)
          npm run test:coverage
          echo "\`test-front\` — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: front-coverage
          path: coverage
          retention-days: 7

  sonar-front:
    name: Sonar Front
    needs: test-front
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: front-coverage
          path: coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=devnotes-front
            -Dsonar.organization=vmillet-dev
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=src/**/*.spec.ts
            -Dsonar.coverage.exclusions=src/**/*.spec.ts,src/main.ts,src/test.ts,src/testing/*.ts,src/**/bindings.ts,src/**/*.repository.ts,src/**/*.worker.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/devnotes/lcov.info
            -Dsonar.cpd.exclusions=src/app/tools/catalogue/**/*.data.ts
            -Dsonar.issue.ignore.multicriteria=mixins
            -Dsonar.issue.ignore.multicriteria.mixins.ruleKey=css:S8776
            -Dsonar.issue.ignore.multicriteria.mixins.resourceKey=src/styles/_mixins.scss
            -Dsonar.qualitygate.wait=true

  test-rust:
    name: Test Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - uses: actions/checkout@v7

      # Its own key on each platform: on Linux it holds the instrumented build coverage wants,
      # which no other job produces.
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: test-${{ matrix.os }}
          save-if: 'true'

      - name: Placeholder frontendDist
        run: |
          mkdir -p dist/devnotes/browser
          printf '<!doctype html><title>ci</title>' > dist/devnotes/browser/index.html

      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Test + coverage
        if: runner.os == 'Linux'
        run: |
          mkdir -p coverage

          start=$(date +%s)

          cargo llvm-cov \
            --manifest-path src-tauri/Cargo.toml \
            --locked \
            --lcov \
            --output-path coverage/lcov.info

          echo "\`test-rust\` (${{ matrix.os }}) — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        if: runner.os == 'Windows'
        run: |
          start=$(date +%s)

          cargo test \
            --manifest-path src-tauri/Cargo.toml \
            --locked

          echo "\`test-rust\` (${{ matrix.os }}) — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Rust coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: coverage/lcov.info
          retention-days: 7

  sonar-rust:
    name: Sonar Rust
    needs: test-rust
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-rust
        with:
          shared-key: rust-sonar

      - name: Placeholder frontendDist
        run: |
          mkdir -p dist/devnotes/browser
          printf '<!doctype html><title>ci</title>' > dist/devnotes/browser/index.html

      - name: Download Rust coverage
        uses: actions/download-artifact@v8
        with:
          name: rust-coverage
          path: coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=vmillet-dev
            -Dsonar.projectKey=devnotes-rust
            -Dsonar.sources=src-tauri
            -Dsonar.tests=src-tauri
            -Dsonar.test.inclusions=src-tauri/tests/**,src-tauri/benches/**
            -Dsonar.rust.cargo.manifestPaths=src-tauri/Cargo.toml
            -Dsonar.rust.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true

  # The end-to-end suite is the only one that launches the assembled application: real binary,
  # real WebView, real SQLite file on disk. Both platforms of the release matrix are covered, and
  # they do not break the same way: the WebView is WebView2 on Windows and WebKitGTK on Linux,
  # and above all Windows conflates `data_dir()` and `config_dir()` (both `%APPDATA%\<id>`)
  # where Linux keeps them apart. It is the only runner able to disprove a path — it has already
  # caught a `preferences.json` looked for in the wrong place.
  #
  # Three steps: the scenarios are listed, the binary is built once per platform, and each
  # scenario then runs alone on a runner of its own, against that binary and a virgin profile.

  # The files themselves, so a new scenario joins the matrix without a second list to edit.
  e2e-scenarios:
    name: E2E scenarios
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      specs: ${{ steps.list.outputs.specs }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: e2e/specs

      # Names without `.e2e.ts`: what `E2E_SPEC` takes and what each job is called.
      - id: list
        run: |
          specs=$(find e2e/specs -name '*.e2e.ts' -printf '%f\n' | sed 's/\.e2e\.ts$//' | sort | jq -Rnc '[inputs]')
          echo "specs=$specs" >> "$GITHUB_OUTPUT"
          echo "$specs" | jq -r '"\(length) scenarios: \(join(", "))"'

  build-e2e:
    name: Build E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The action's apt step installs the Tauri dependencies on Linux; on Windows it only
      # lays down the toolchain and the cargo cache.
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: e2e-${{ matrix.os }}
          save-if: 'true'

      - run: npm ci

      # `tauri build` chains `beforeBuildCommand` (the e2e front-end build) then cargo, and the
      # front end is embedded in the binary. It carries the `com.devnotes.app.e2e` identifier,
      # so its profile is its own: it cannot overwrite an existing library.
      - name: Build the e2e binary
        run: |
          start=$(date +%s)
          npm run e2e:build
          echo "\`build-e2e\` (${{ matrix.os }}) — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

      # What the binary needs beside it, laid out as cargo left it. `identity/` is the identity
      # tool's resource, copied there by `tauri-build`. ⚠️ On Linux, Tauri reads resources next
      # to the executable only in a `target/<profile>` holding `.cargo-lock`; anywhere else it
      # looks in `/usr/lib/devnotes`, and the identity tool answers that its lists are missing.
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-app-${{ matrix.os }}
          path: |
            src-tauri/target/debug/${{ runner.os == 'Windows' && 'devnotes.exe' || 'devnotes' }}
            src-tauri/target/debug/identity/
            src-tauri/target/debug/.cargo-lock
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # No cargo here: the binary comes from `build-e2e`. Each job is its own runner, so its own
  # process, its own profile and its own logs, and nothing in it depends on another job.
  test-e2e:
    name: E2E ${{ matrix.spec }} (${{ matrix.os }})
    needs: [e2e-scenarios, build-e2e]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # One runner per job, whatever WebdriverIO's own `maxInstances` says.
      max-parallel: 4
      matrix:
        os: [windows-latest, ubuntu-22.04]
        spec: ${{ fromJSON(needs.e2e-scenarios.outputs.specs) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # What the binary loads, not what builds it. WebKitGTK needs an X server: without one the
      # window never opens and the embedded WebDriver server never listens.
      - name: WebView and X server
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-1 libwebkit2gtk-4.1-0 libxdo3 xvfb

      # WebdriverIO and the harness.
      - run: npm ci

      # Where `e2e/wdio.conf.ts` looks for it. An artifact keeps no file mode.
      - uses: actions/download-artifact@v8
        with:
          name: e2e-app-${{ matrix.os }}
          path: src-tauri/target/debug

      - name: Executable bit
        if: runner.os == 'Linux'
        run: chmod +x src-tauri/target/debug/devnotes

      # `npm run test:e2e` wipes the profile first, so a re-run of the job starts as virgin as
      # the first. `xvfb-run` wraps the runner, not the binary: the wdio service is what
      # launches the application, from its own `onPrepare`, so DISPLAY has to exist for the
      # whole process.
      - name: Run ${{ matrix.spec }}
        env:
          E2E_SPEC: ${{ matrix.spec }}
        run: |
          start=$(date +%s)
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npm run test:e2e
          else
            npm run test:e2e
          fi
          echo "\`$E2E_SPEC\` (${{ matrix.os }}) — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

      # The runner's log, the application's Rust log, and for each failed test a screenshot plus
      # what was on screen, the page's console included — never the profile, whose library is
      # the run's. `E2E_LOG_LEVEL=trace` by hand when a session refuses to open.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-logs-${{ matrix.os }}-${{ matrix.spec }}
          path: e2e/logs
          if-no-files-found: ignore
          retention-days: 7
