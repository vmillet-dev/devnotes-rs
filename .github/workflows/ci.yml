name: CI

# A milestone's work merges into its `dev/x.y.z` branch first, then into main: both are checked alike.
on:
  push:
    branches: [main, 'dev/**']
  pull_request:
    branches: [main, 'dev/**']

# Stacked runs on a branch are cancelled. No tag run to spare any more: publishing lives
# in `release.yml`, which has a concurrency group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # A pull request that touches documentation alone builds and runs nothing: a README cannot
  # break the application, and a flaky scenario must not block it. Lint docs still runs, as
  # Prettier checks the Markdown. The Rust side is skipped too when only `website/` changes: the
  # site has a job of its own. A push, to main or a milestone branch, checks everything.
  changes:
    name: Changes
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      website: ${{ steps.diff.outputs.website }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "website=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          # The site copies the application's palette, and a test holds the copy to it.
          if echo "$changed" | grep -qE '^website/|^crates/ui/src/theme/tokens\.rs$|^\.github/workflows/(ci|website)\.yml$'; then
            echo "website=true" >> "$GITHUB_OUTPUT"
          else
            echo "website=false" >> "$GITHUB_OUTPUT"
          fi
          code=$(echo "$changed" | grep -vE '\.md$|^docs/|^LICENSE$|^website/' || true)
          if [ -n "$code" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation only: the build, the tests and the scenarios are skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

      # A failed job hands its run to `stop.yml`, which cancels it, and every other run of its
      # commit, seconds later. ⚠️ Not `gh run cancel` here: cancelled from inside, the job would
      # end « cancelled » and hide what failed. A Dependabot run is read-only and says so.
      - &stop-the-run
        name: Stop the run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run stop.yml --repo "$GITHUB_REPOSITORY" --ref "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          -f run="$GITHUB_RUN_ID" || echo "::notice::This token cannot stop the run"

  lint-docs:
    name: Lint docs
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Prettier over the Markdown, JSON and YAML, this workflow file included.
      - run: npm run lint

      # The release scripts run on Node's own test runner.
      - run: npm run test:scripts

      - *stop-the-run

  # The showcase site (docs/architecture.md → "The website"): its own project and lockfile. The
  # build fetches the latest release and asks GitHub for every download link.
  website:
    name: Website
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run test:scripts

      - run: npm test

      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - *stop-the-run

  lint-rust:
    name: Lint Rust
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # ⚠️ A key of its own: a cache entry has one writer and never changes afterwards, and
      # Clippy's check artifacts are in nobody else's build.
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: lint-ubuntu-22.04
          save-if: 'true'

      - run: cargo fmt --all --check

      # `--all-features` is what type-checks the `e2e` feature.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # The inspection port answers anyone on the machine: only the `e2e` flavour links it. The
      # profiler serves egui's frames on a port too: only `--features profiling` does.
      - name: No inspection port nor profiler outside their flavours
        run: |
          for crate in egui_inspection puffin puffin_http; do
            if cargo tree -p app --edges normal --invert "$crate" --locked > /dev/null 2>&1; then
              echo "::error::the default build of app links $crate"
              exit 1
            fi
          done

      - *stop-the-run

  test-rust:
    name: Test Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    # Where `app::captures` writes the window's states.
    env:
      DEVNOTES_CAPTURES: ${{ github.workspace }}/captures

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - uses: actions/checkout@v7

      # Its own key on each platform: on Linux it holds the instrumented build coverage wants,
      # which no other job produces.
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: test-${{ matrix.os }}
          save-if: 'true'

      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Test + coverage
        if: runner.os == 'Linux'
        run: |
          mkdir -p coverage

          start=$(date +%s)

          cargo llvm-cov \
            --workspace \
            --exclude e2e \
            --locked \
            --lcov \
            --output-path coverage/lcov.info

          echo "\`test-rust\` (${{ matrix.os }}) — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        if: runner.os == 'Windows'
        run: |
          start=$(date +%s)

          cargo test \
            --workspace \
            --exclude e2e \
            --locked

          echo "\`test-rust\` (${{ matrix.os }}) — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

      # For a look by eye beside the reference's captures; nothing compares them.
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: captures-${{ matrix.os }}
          path: captures
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Rust coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: coverage/lcov.info
          retention-days: 7

      - *stop-the-run

  sonar-rust:
    name: Sonar Rust
    needs: test-rust
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-rust
        with:
          shared-key: rust-sonar

      - name: Download Rust coverage
        uses: actions/download-artifact@v8
        with:
          name: rust-coverage
          path: coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=vmillet-dev
            -Dsonar.projectKey=devnotes-rust
            -Dsonar.sources=crates,e2e
            -Dsonar.tests=crates,e2e
            -Dsonar.test.inclusions=crates/*/tests/**,crates/*/benches/**,e2e/tests/**
            -Dsonar.exclusions=crates/engine/sandbox/dist/**,crates/engine/sandbox/node_modules/**
            -Dsonar.coverage.exclusions=crates/engine/src/**/*.js,crates/engine/sandbox/*.mjs,e2e/**,crates/app/src/unpainted.rs,crates/app/src/desktop.rs,crates/platform/src/**/system.rs,crates/ui/src/app/screens.rs,crates/ui/src/app/perf.rs
            -Dsonar.rust.cargo.manifestPaths=Cargo.toml
            -Dsonar.rust.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true

      - *stop-the-run

  # From `changes` on, beside the Rust tests: the flavour, then every scenario of `e2e/`,
  # one after the other, each its own process and profile (D31). One failing scenario decides the
  # run: the other platform is cancelled with it.
  e2e:
    name: E2E (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-22.04, windows-latest]

    # The flavour in `target/debug`, where the cache is: nothing else builds `app` in this job.
    env:
      DEVNOTES_E2E_BIN: ${{ github.workspace }}/target/debug/devnotes${{ matrix.os == 'windows-latest' && '.exe' || '' }}
      DEVNOTES_E2E_OUTPUT: ${{ github.workspace }}/scenarios

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust
        with:
          shared-key: e2e-${{ matrix.os }}
          save-if: 'true'

      # The capture needs a rendered window, which xvfb gives without a window manager.
      - name: X server
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends xvfb

      - name: Build the flavour
        run: cargo build -p app --features e2e --locked

      # The output kept, and the summary says what ran on each platform: a scenario skipped would
      # otherwise show only as a shorter log. `set +e`: the table is written when one fails too.
      - name: Scenarios
        run: |
          start=$(date +%s)
          output="$RUNNER_TEMP/scenarios.log"
          set +e
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" cargo test -p e2e --locked -- --nocapture 2>&1 | tee "$output"
            status=${PIPESTATUS[0]}
          else
            cargo test -p e2e --locked -- --nocapture 2>&1 | tee "$output"
            status=${PIPESTATUS[0]}
          fi
          set -e
          {
            echo "\`e2e\` (${{ matrix.os }}) — $(($(date +%s) - start)) s"
            echo
            sed 's/\x1b\[[0-9;]*m//g' "$output" | awk '
              match($0, /tests.[0-9a-z_]+\.rs/) { name = substr($0, RSTART + 6, RLENGTH - 9); order[++n] = name; next }
              /Doc-tests/ { name = "" }
              /^▶ / { steps[name]++ }
              /^test result:/ && name != "" { result[name] = $3; time[name] = $NF }
              END {
                print "| Scenario | Steps | Result | Time |"
                print "| --- | --- | --- | --- |"
                for (i = 1; i <= n; i++) {
                  k = order[i]
                  sub(/\.$/, "", result[k])
                  printf "| `%s` | %d | %s | %s |\n", k, steps[k], result[k] == "" ? "not run" : result[k], time[k]
                }
              }'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Captures, and for a failed scenario its last screen and the application's log; never the
      # profile, whose library is the run's. Named per attempt: a re-run that passes would
      # otherwise replace the files of the attempt that failed.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-${{ matrix.os }}-${{ github.run_attempt }}
          path: scenarios
          if-no-files-found: ignore
          retention-days: 7

      - *stop-the-run
