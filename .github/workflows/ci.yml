name: CI

# A milestone's work merges into its `dev/x.y.z` branch first, then into main: both are checked alike.
on:
  push:
    branches: [main, 'dev/**']
  pull_request:
    branches: [main, 'dev/**']

# Stacked runs on a branch are cancelled. No tag run to spare any more: publishing lives
# in `release.yml`, which has a concurrency group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # A pull request that touches documentation alone builds and runs nothing: a README cannot
  # break the application, and a flaky scenario must not block it. Lint docs still runs, as
  # Prettier checks the Markdown. A push, to main or a milestone branch, checks everything.
  changes:
    name: Changes
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(git diff --name-only "$BASE" HEAD | grep -vE '\.md$|^docs/|^reference/|^LICENSE$' || true)
          if [ -n "$code" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation only: the build, the tests and the scenarios are skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

      # A failed job hands its run to `stop.yml`, which cancels it, and every other run of its
      # commit, seconds later. ⚠️ Not `gh run cancel` here: cancelled from inside, the job would
      # end « cancelled » and hide what failed. A Dependabot run is read-only and says so.
      - &stop-the-run
        name: Stop the run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run stop.yml --repo "$GITHUB_REPOSITORY" --ref "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          -f run="$GITHUB_RUN_ID" || echo "::notice::This token cannot stop the run"

  lint-docs:
    name: Lint docs
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Prettier over the Markdown, JSON and YAML, this workflow file included.
      - run: npm run lint

      # The release scripts run on Node's own test runner.
      - run: npm run test:scripts

      - *stop-the-run

  lint-rust:
    name: Lint Rust
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # ⚠️ A key of its own: a cache entry has one writer and never changes afterwards, and
      # Clippy's check artifacts are in nobody else's build.
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: lint-ubuntu-22.04
          save-if: 'true'

      - run: cargo fmt --all --check

      # `--all-features` is what type-checks the `e2e` feature.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # The inspection port answers anyone on the machine: only the `e2e` flavour links it.
      - name: No inspection port outside the e2e flavour
        run: |
          if cargo tree -p app --edges normal --invert egui_inspection --locked > /dev/null 2>&1; then
            echo "::error::the default build of app links egui_inspection"
            exit 1
          fi

      - *stop-the-run

  test-rust:
    name: Test Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    # Where `app::captures` writes the window's states.
    env:
      DEVNOTES_CAPTURES: ${{ github.workspace }}/captures

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - uses: actions/checkout@v7

      # Its own key on each platform: on Linux it holds the instrumented build coverage wants,
      # which no other job produces.
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: test-${{ matrix.os }}
          save-if: 'true'

      # kittest draws on a software adapter: lavapipe here, WARP on Windows, which ships with it.
      - name: Software Vulkan
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers

      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Test + coverage
        if: runner.os == 'Linux'
        run: |
          mkdir -p coverage

          start=$(date +%s)

          cargo llvm-cov \
            --workspace \
            --exclude e2e \
            --locked \
            --lcov \
            --output-path coverage/lcov.info

          echo "\`test-rust\` (${{ matrix.os }}) — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        if: runner.os == 'Windows'
        run: |
          start=$(date +%s)

          cargo test \
            --workspace \
            --exclude e2e \
            --locked

          echo "\`test-rust\` (${{ matrix.os }}) — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

      # For a look by eye beside the reference's captures; nothing compares them.
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: captures-${{ matrix.os }}
          path: captures
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Rust coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: coverage/lcov.info
          retention-days: 7

      - *stop-the-run

  sonar-rust:
    name: Sonar Rust
    needs: test-rust
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-rust
        with:
          shared-key: rust-sonar

      - name: Download Rust coverage
        uses: actions/download-artifact@v8
        with:
          name: rust-coverage
          path: coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=vmillet-dev
            -Dsonar.projectKey=devnotes-rust
            -Dsonar.sources=crates
            -Dsonar.tests=crates
            -Dsonar.test.inclusions=crates/*/tests/**,crates/*/benches/**
            -Dsonar.exclusions=crates/engine/sandbox/dist/**,crates/engine/sandbox/node_modules/**
            -Dsonar.coverage.exclusions=crates/engine/src/**/*.js,crates/engine/sandbox/*.mjs
            -Dsonar.rust.cargo.manifestPaths=Cargo.toml
            -Dsonar.rust.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true

      - *stop-the-run
