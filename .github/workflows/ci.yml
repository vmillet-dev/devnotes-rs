name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Stacked runs on a branch are cancelled. No tag run to spare any more: publishing lives
# in `release.yml`, which has a concurrency group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-front:
    name: Lint front
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # ESLint (template accessibility rules included) plus the Prettier check, which also
      # covers this workflow file.
      - run: npm run lint

      # The release-notes generator is neither Angular nor Rust: its runner is Node's own,
      # with no dependency to install.
      - run: npm run test:scripts

  lint-rust:
    name: Lint Rust
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust
        with:
          shared-key: rust-ubuntu

      # `generate_context!` reads frontendDist at compile time. Making this job depend on the
      # front-end build would serialise it for nothing: it validates Rust, not the bundle.
      - name: Placeholder frontendDist
        run: |
          mkdir -p dist/devnotes/browser
          printf '<!doctype html><title>ci</title>' > dist/devnotes/browser/index.html

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # `--all-features` is what type-checks the `e2e` feature. Without it a break in
      # the end-to-end harness only surfaces at the next `npm run e2e:build`.
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings

  build-front:
    name: Build front
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/cache@v6
        with:
          path: .angular/cache
          key: angular-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            angular-${{ hashFiles('package-lock.json') }}-
            angular-

      - run: npm ci

      - name: Build
        run: |
          start=$(date +%s)
          npm run build
          echo "\`build-front\` — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

      # Not consumed by `test-front`: angular.json's `test` target rebuilds its own dev build
      # (buildTarget "::development"). Kept short, as evidence and for debugging.
      - uses: actions/upload-artifact@v7
        with:
          name: front-dist
          path: dist/devnotes/browser
          retention-days: 1

  build-rust:
    name: Build Rust
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The only job allowed to write the cargo cache, so `test-rust` reads it without racing.
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: rust-ubuntu
          save-if: 'true'

      - name: Placeholder frontendDist
        run: |
          mkdir -p dist/devnotes/browser
          printf '<!doctype html><title>ci</title>' > dist/devnotes/browser/index.html

      - name: Build
        run: |
          start=$(date +%s)
          cargo build --manifest-path src-tauri/Cargo.toml --locked
          echo "\`build-rust\` — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

  test-front:
    name: Test front
    needs: build-front
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Read-only: the cache was written by `build-front`, whose post-step has finished.
      - uses: actions/cache/restore@v6
        with:
          path: .angular/cache
          key: angular-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            angular-${{ hashFiles('package-lock.json') }}-
            angular-

      - run: npm ci

      # The 80% coverage thresholds are the guard.
      - name: Test
        run: |
          start=$(date +%s)
          npm run test:coverage
          echo "\`test-front\` — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: front-coverage
          path: coverage
          retention-days: 7

  sonar-front:
    name: Sonar Front
    needs: test-front
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: front-coverage
          path: coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=devnotes-front
            -Dsonar.organization=vmillet-dev
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=src/**/*.spec.ts
            -Dsonar.coverage.exclusions=src/**/*.spec.ts,src/main.ts,src/test.ts,src/testing/*.ts,src/**/bindings.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/devnotes/lcov.info
            -Dsonar.issue.ignore.multicriteria=mixins
            -Dsonar.issue.ignore.multicriteria.mixins.ruleKey=css:S8776
            -Dsonar.issue.ignore.multicriteria.mixins.resourceKey=src/styles/_mixins.scss
            -Dsonar.qualitygate.wait=true

  test-rust:
    name: Test Rust (${{ matrix.os }})
    needs: build-rust
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cache-key: rust-ubuntu
            save-cache: 'false'

          - os: windows-latest
            cache-key: rust-windows
            save-cache: 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust
        with:
          shared-key: ${{ matrix.cache-key }}
          save-if: ${{ matrix.save-cache }}

      - name: Placeholder frontendDist
        run: |
          mkdir -p dist/devnotes/browser
          printf '<!doctype html><title>ci</title>' > dist/devnotes/browser/index.html

      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Test + coverage
        if: runner.os == 'Linux'
        run: |
          mkdir -p coverage

          start=$(date +%s)

          cargo llvm-cov \
            --manifest-path src-tauri/Cargo.toml \
            --locked \
            --lcov \
            --output-path coverage/lcov.info

          echo "\`test-rust\` (${{ matrix.os }}) — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        if: runner.os == 'Windows'
        run: |
          start=$(date +%s)

          cargo test \
            --manifest-path src-tauri/Cargo.toml \
            --locked

          echo "\`test-rust\` (${{ matrix.os }}) — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Rust coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: coverage/lcov.info
          retention-days: 7

  sonar-rust:
    name: Sonar Rust
    needs: test-rust
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-rust
        with:
          shared-key: rust-sonar

      - name: Placeholder frontendDist
        run: |
          mkdir -p dist/devnotes/browser
          printf '<!doctype html><title>ci</title>' > dist/devnotes/browser/index.html

      - name: Download Rust coverage
        uses: actions/download-artifact@v7
        with:
          name: rust-coverage
          path: coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=vmillet-dev
            -Dsonar.projectKey=devnotes-rust
            -Dsonar.sources=src-tauri
            -Dsonar.tests=src-tauri
            -Dsonar.test.inclusions=src-tauri/tests/**,src-tauri/benches/**
            -Dsonar.rust.cargo.manifestPaths=src-tauri/Cargo.toml
            -Dsonar.rust.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true

  # The only job that launches the assembled application: real binary, real WebView, real
  # SQLite file on disk. Both platforms of the release matrix are covered, and they do not
  # break the same way: the WebView is WebView2 on Windows and WebKitGTK on Linux, and above
  # all Windows conflates `data_dir()` and `config_dir()` (both `%APPDATA%\<id>`) where Linux
  # keeps them apart. It is the only runner able to disprove a path — it has already caught a
  # `preferences.json` looked for in the wrong place.
  test-e2e:
    name: Test E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The action's apt step installs the Tauri dependencies on Linux; on Windows it only
      # lays down the toolchain and the cargo cache.
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: e2e-${{ matrix.os }}
          save-if: 'true'

      # WebKitGTK needs an X server: without one the window never opens and the embedded
      # WebDriver server never listens.
      - name: Virtual X server
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends xvfb

      - run: npm ci

      # `tauri build` chains `beforeBuildCommand` (the e2e front-end build) then cargo. The
      # binary it produces carries the `com.devnotes.app.e2e` identifier, so its profile is its
      # own: it cannot overwrite an existing library.
      - name: Build the e2e binary
        run: |
          start=$(date +%s)
          npm run e2e:build
          echo "\`build-e2e\` (${{ matrix.os }}) — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

      # `xvfb-run` wraps the runner, not the binary: the wdio service is what launches the
      # application, from its own `onPrepare`, so DISPLAY has to exist for the whole process.
      - name: Run the scenarios
        run: |
          start=$(date +%s)
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npm run test:e2e
          else
            npm run test:e2e
          fi
          echo "\`test-e2e\` (${{ matrix.os }}) — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

      # `E2E_LOG_LEVEL=trace` by hand on a failing run: by default the logs stay readable, and
      # a session that refuses to open is diagnosed by re-running the job with the variable.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-logs-${{ matrix.os }}
          path: e2e/logs
          retention-days: 7
