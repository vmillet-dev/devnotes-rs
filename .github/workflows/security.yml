name: Security

# Two triggers, because they catch different things. On a pull request: a dependency
# arriving with a known advisory or an incompatible license, while there is still a
# review to act on. On a schedule: an advisory published *after* a dependency was
# merged, which no push would ever surface.
on:
  pull_request:
    branches: [main, 'dev/**']
    paths:
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/deny.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/security.yml'
  schedule:
    # Monday morning, so the week starts with the answer rather than ends with it.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-deny:
    name: Cargo advisories
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Reads `Cargo.lock` and the advisory database; it compiles nothing, which is
      # why this job needs no Rust toolchain and no cargo cache.
      #
      # ⚠️ `advisories` alone, and it is the repository's only advisory net — Dependabot
      # alerts are off. `licenses`, `bans` and `sources` stood here and never made a
      # decision in 25 runs; the GPL-3.0 compatibility of the tree is a release-time
      # review, not a per-pull-request gate.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories

  npm-audit:
    name: npm advisories
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Production dependencies only. The dev tree pulls in a build chain whose
      # advisories never reach a user's machine, and a job that cries wolf on those
      # is a job everyone learns to ignore.
      #
      # ⚠️ `--omit=dev` reads the section a package is *declared* in, not what is
      # actually bundled — `cosmiconfig` counts as production because transloco is a
      # dependency. It is a coarse cut, and it errs on the safe side.
      - name: Advisories that block
        run: npm audit --omit=dev --audit-level=high

      # `high` and above failed the step above; what is left is reported and does not
      # hold a pull request. A moderate advisory in a shipped dependency is still
      # worth seeing — it just should not be the thing that stops a fix landing.
      #
      # `success() || failure()` and not `always()`: a red gate above should still print the
      # whole picture, but a cancelled run or a failed `npm ci` should not reach a step that
      # can only report on an audit it never got to run.
      - name: Advisories worth knowing about
        if: success() || failure()
        run: |
          npm audit --omit=dev --json > audit.json || true
          node <<'EOF'
          const fs = require('fs');

          // ⚠️ A registry that times out still exits non-zero *and* writes something that is
          // not an audit — an `{ "error": … }` object, or nothing at all. This step reports;
          // it must never be the reason a pull request goes red.
          let audit;
          try {
            audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          } catch (error) {
            console.log(`::warning title=npm audit::the audit produced no readable report (${error.message})`);
            process.exit(0);
          }

          if (!audit.vulnerabilities || !audit.metadata?.vulnerabilities) {
            console.log('::warning title=npm audit::the audit reported an error instead of a result');
            process.exit(0);
          }

          const counts = audit.metadata.vulnerabilities;

          const noted = Object.values(audit.vulnerabilities)
            .filter((entry) => ['low', 'moderate'].includes(entry.severity))
            .sort((a, b) => a.name.localeCompare(b.name));

          // An advisory entry carries its detail in `via`, where a string is a parent
          // package and an object is the advisory itself.
          const detailed = (entry) => entry.via.find((via) => typeof via === 'object');

          for (const entry of noted) {
            const advisory = detailed(entry);
            const detail = advisory
              ? `${advisory.title} — ${advisory.url}`
              : `via ${entry.via.join(', ')}`;
            const fix = entry.fixAvailable ? 'fix available' : 'no fix published';
            console.log(
              `::warning title=npm audit (${entry.severity})::${entry.name} ${entry.range}: ${detail} (${fix})`,
            );
          }

          const lines = ['### npm advisories (production tree)', ''];
          if (noted.length === 0) {
            lines.push('Nothing below the blocking threshold.');
          } else {
            lines.push(
              `${counts.moderate} moderate, ${counts.low} low — reported, not blocking. \`high\` and above fail the job.`,
              '',
              '| Package | Severity | Advisory | Fix |',
              '| --- | --- | --- | --- |',
            );
            for (const entry of noted) {
              const advisory = detailed(entry);
              const link = advisory
                ? `[${advisory.title}](${advisory.url})`
                : `via ${entry.via.join(', ')}`;
              lines.push(
                `| \`${entry.name}\` | ${entry.severity} | ${link} | ${entry.fixAvailable ? 'yes' : 'none'} |`,
              );
            }
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          EOF
