name: Release

# One button. The version is already in the root Cargo.toml — a human bumps it, and this
# workflow draws a changelog section, a commit, a tag, the bundles and the release from it.
#
# All in the same run, and that is not a comfort choice: a tag pushed with the default
# GITHUB_TOKEN triggers no workflow, so there is no second run to wait for. And the changelog
# has to be committed *before* the build: `changelog.rs` embeds it with `include_str!`, so a
# file written after the tag would ship a binary whose "What's new" panel does not know its
# own version.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run everything except the commit, the tag and the publication.'
        type: boolean
        default: false

# Never cancelled: a run cut between the commit and the tag would leave main ahead of the
# tags. `--atomic` covers the push itself, the concurrency group covers the rest.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Everything that can refuse the release does so here, and before anything is written: the
  # mutations are the last two steps of the job.
  #
  # This job replays no test — CI has already run on this commit, it merely checks that. What
  # it does execute: npm ci, the generator's tests, and Prettier.
  prepare:
    name: Prepare the release
    # The environment is what really restricts the workflow to main: its branch rule refuses
    # to start the job from another ref, where an `if` would only note it after reserving a
    # runner. It is also where the signing secrets live.
    environment: release
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
      # Without it, `closingIssuesReferences` returns empty nodes and the whole sorting
      # silently falls back to the title prefix.
      issues: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      # `fetch-depth: 0` for `git describe` and the commit range; the credentials stay in the
      # worktree, they are what will push the commit and the tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      # A readable double of the environment's branch rule, for the day that rule is not yet
      # configured.
      - name: Releases only go out from main
        if: github.ref_name != 'main'
        run: |
          echo "::error::dispatched from ${{ github.ref_name }}, the release goes out from main"
          exit 1

      # One version for the whole workspace (D27): `[workspace.package]` in Cargo.toml, which
      # Cargo.lock must repeat — the build is `--locked`. Checked before the tag exists, so a
      # mismatch costs a re-run rather than a deleted tag. Node is set up first for it.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Read the version
        id: version
        run: |
          version=$(node scripts/version.mjs)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Neither the tag nor the release may exist
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG already exists"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG already exists on origin"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists"
            exit 1
          fi

      # Idempotence guard: a re-dispatch after a successful `prepare` must say why it refuses,
      # rather than stacking a second section.
      - name: The changelog must not already carry the section
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if grep -qE "^## +\[?${VERSION//./\\.}\]?( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md already carries a $VERSION section"
            exit 1
          fi

      # The gate: this is what excuses the release from replaying anything. `test-e2e` being
      # `continue-on-error`, its failure holds nothing back — the whole run's conclusion is
      # what decides, exactly as before.
      - name: CI must be green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r status conclusion <<< "$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" \
            --limit 1 --json status,conclusion \
            --jq '.[0] // {} | "\(.status // "none") \(.conclusion // "none")"')"
          echo "CI on $GITHUB_SHA: $status / $conclusion"
          if [ "$status" != completed ]; then
            echo "::error::CI has not finished on this commit ($status) — retry in a few minutes"
            exit 1
          fi
          if [ "$conclusion" != success ]; then
            echo "::error::CI concluded \"$conclusion\" on this commit"
            exit 1
          fi

      # For Prettier, which reformats the written file: an unformatted CHANGELOG.md would
      # break `npm run lint` on somebody else's next push.
      - run: npm ci

      - run: npm run test:scripts

      # Prettier runs between writing and extracting: the release body is read from the exact
      # bytes that will be committed. The `--check` after the `--write` is not redundant, it
      # secures the fixed point `npm run lint` will demand on the next human push.
      - name: Write the section and draw the release body from it
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/release-notes.mjs generate --version "$VERSION" --write \
            --summary "$GITHUB_STEP_SUMMARY"
          npx prettier --write CHANGELOG.md
          npx prettier --check CHANGELOG.md
          node scripts/release-notes.mjs extract --version "$VERSION" \
            --out "$RUNNER_TEMP/release-notes.md"
          cp CHANGELOG.md "$RUNNER_TEMP/CHANGELOG.md"

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/*.md
          retention-days: 7

      # First and last mutation of the repository. Everything above can fail leaving nothing
      # behind.
      - name: Commit, tag, push
        id: push
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "$TAG"
          # `--atomic`: the commit and the tag go out together or not at all. Without it, a
          # refusal of the second would leave main ahead of the tags, and the retry would hit
          # the section already written with no simple way back.
          git push --atomic origin HEAD:main "refs/tags/$TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Preview only
        if: ${{ inputs.dry_run }}
        run: echo "::notice::dry run — nothing was committed, tagged or published"

  # In a dry run too: the packages and their signatures by the real key are what a dry run
  # proves, without publishing them. Its binary carries the changelog as it was, without the
  # section `prepare` did not commit.
  release-build:
    name: Package ${{ matrix.target }}
    needs: prepare
    environment: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 and not ubuntu-latest: 24.04 links a newer glibc and the AppImage it
          # produces then refuses to start on older distributions.
          - os: ubuntu-22.04
            target: linux
          - os: windows-latest
            target: windows
    steps:
      # The SHA rather than the tag name: the tag was just created by `prepare`, and a SHA
      # cannot come to mean something else in between.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha || github.sha }}

      - uses: ./.github/actions/setup-rust
        with:
          shared-key: release-${{ matrix.target }}
          save-if: 'true'

      - run: cargo build -p app --release --locked

      # ⚠️ The secrets keep the names they had under Tauri: the same minisign key, the same
      # password (D26). Without them the packager signs nothing and `publish` refuses a
      # manifest with no signature, rather than shipping what the updater would refuse.
      - uses: ./.github/actions/package
        with:
          private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          out: release

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: release
          retention-days: 7

  publish:
    name: Publish the release
    needs: [prepare, release-build]
    if: ${{ !inputs.dry_run }}
    environment: release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # ⚠️ Before `download-artifact`: `checkout` cleans the workspace, and would take the
      # downloaded bundles with it. The repository is here for `scripts/release-notes.mjs`,
      # which re-reads the section at the tag — the committed file is the only source of both
      # the release body and the "What's new" panel.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: release

      # Outside `release/`: that folder goes whole into the release and into the checksums.
      - name: Re-read the section at the tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node scripts/release-notes.mjs extract --version "$VERSION" \
            --out "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      # The manifest the updater reads, with each platform's `format` (D26).
      - name: Assemble latest.json
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          node scripts/latest-json.mjs --dir release --version "$TAG" \
            --base "https://github.com/$REPO/releases/download/$TAG" \
            --notes "$RUNNER_TEMP/release-notes.md"

      - name: Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # ⚠️ The page's body is the changelog section **plus a compare link**, and not the
      # extracted file itself: that one is what the manifest carries, and a link in a `<pre>`
      # inside the update prompt is noise nobody can click.
      - name: Body for the release page
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          cp "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/release-body.md"
          # ⚠️ From the tag's own parent, not from the workflow's idea of the last release:
          # the tag exists by now, so `$TAG^` is the commit it was cut from.
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            {
              echo
              echo "**Diff** : https://github.com/$REPO/compare/$previous...$TAG"
            } >> "$RUNNER_TEMP/release-body.md"
          fi
          cat "$RUNNER_TEMP/release-body.md"

      # `tag_name` is mandatory here: without it the action falls back on `github.ref`, which
      # is `refs/heads/main` on a `workflow_dispatch`.
      #
      # ⚠️ `generate_release_notes` is **off**. It appends the raw pull-request list — and
      # `scripts/release-notes.mjs` builds the section above from *those same* merged pull
      # requests, sorted into the changelog's categories. Leaving it on listed every change
      # twice on one page, once grouped and once flat. What it also gave was the new
      # contributors, which says nothing on a repository with one author, and the comparison
      # link, which the step above writes in one line.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          body_path: ${{ runner.temp }}/release-body.md
          generate_release_notes: false
          files: release/*
