version: 2

# Weekly, grouped by kind: one pull request per family a week, so a break points at one
# family rather than at a month of updates. Every group takes minors and patches; a major comes
# alone.
#
# ⚠️ A group listed by name loses its members to a group listed by update type: Dependabot
# ranks `update-types` as the more specific rule. Hence the `exclude-patterns` of the last
# group, which must name every pattern of every group above it.
#
# ⚠️ Cargo takes `versioning-strategy: auto` or `lockfile-only` only; `increase` makes the whole
# file invalid. So a bump the declared range allows changes `Cargo.lock` alone, and the root
# `Cargo.toml` (`[workspace.dependencies]`, the one place a version is written) falls behind it
# until raised by hand.

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      interface:
        update-types: [minor, patch]
        patterns:
          - 'eframe'
          - 'egui'
          - 'egui_*'
          - 'winit'
      storage:
        update-types: [minor, patch]
        patterns:
          - 'diesel'
          - 'diesel_*'
          - 'libsqlite3-sys'
      crypto:
        update-types: [minor, patch]
        patterns:
          - 'aes-gcm'
          - 'argon2'
          - 'zeroize'
          - 'getrandom'
          - 'md-5'
          - 'sha1'
          - 'sha2'
          - 'sha3'
          - 'hmac'
      network:
        update-types: [minor, patch]
        patterns:
          - 'reqwest'
          - 'rustls'
          - 'rustls-*'
          - 'tokio'
          - 'tokio-*'
          - 'tungstenite'
          - 'futures-util'
          - 'url'
          - 'percent-encoding'
          - 'psl'
      serialisation:
        update-types: [minor, patch]
        patterns:
          - 'serde'
          - 'serde_*'
          - 'toml'
          - 'quick-xml'
          - 'yaml-rust2'
      rust-other:
        update-types: [minor, patch]
        exclude-patterns:
          - 'eframe'
          - 'egui'
          - 'egui_*'
          - 'winit'
          - 'diesel'
          - 'diesel_*'
          - 'libsqlite3-sys'
          - 'aes-gcm'
          - 'argon2'
          - 'zeroize'
          - 'getrandom'
          - 'md-5'
          - 'sha1'
          - 'sha2'
          - 'sha3'
          - 'hmac'
          - 'reqwest'
          - 'rustls'
          - 'rustls-*'
          - 'tokio'
          - 'tokio-*'
          - 'tungstenite'
          - 'futures-util'
          - 'url'
          - 'percent-encoding'
          - 'psl'
          - 'serde'
          - 'serde_*'
          - 'toml'
          - 'quick-xml'
          - 'yaml-rust2'

  # Prettier alone: Node is a build tool here, the application has no npm dependency.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        update-types: [minor, patch]
        patterns:
          - '*'
  # Pinned action versions go stale silently: nothing in a green run says an action
  # is two majors behind.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - '*'
