version: 2

# Weekly, grouped by kind: one pull request per family a week, so a break points at one
# family rather than at a month of updates.
#
# ⚠️ A group listed by name loses its members to a group listed by update type: Dependabot
# ranks `update-types` as the more specific rule, which is how `tauri-plugin-*` and
# `@angular/*` ended up in `rust-minor` and `npm-minor`. Hence the `exclude-patterns`, which
# must name every pattern of every group above them.
#
# Families released in lockstep (Angular, Tauri, TipTap, CodeMirror, WebdriverIO) take their
# majors as a group, since half of a major does not install. Every other group takes minors and
# patches, and a major comes alone.
#
# A bump raises the manifest with the lockfile. Cargo's default changes `Cargo.lock` alone while
# the declared range allows the new version, so `Cargo.toml` named versions no build used, hence
# `increase` there. npm's default already means `increase` for an application.
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    versioning-strategy: increase
    open-pull-requests-limit: 10
    # `tauri build` refuses a crate and its npm twin on different minors, and Dependabot opens
    # the two halves as two pull requests in two ecosystems, each red without the other. A
    # Tauri minor is bumped by hand, both halves in one pull request; patches come here.
    ignore:
      - dependency-name: 'tauri'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'tauri-*'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
    groups:
      tauri:
        patterns:
          - 'tauri'
          - 'tauri-*'
      storage:
        update-types: [minor, patch]
        patterns:
          - 'diesel'
          - 'diesel_*'
          - 'libsqlite3-sys'
      crypto:
        update-types: [minor, patch]
        patterns:
          - 'aes-gcm'
          - 'argon2'
          - 'zeroize'
          - 'getrandom'
          - 'md-5'
          - 'sha1'
          - 'sha2'
          - 'sha3'
          - 'hmac'
      network:
        update-types: [minor, patch]
        patterns:
          - 'reqwest'
          - 'rustls'
          - 'rustls-*'
          - 'tokio'
          - 'tokio-*'
          - 'futures-util'
          - 'url'
          - 'percent-encoding'
          - 'psl'
      serialisation:
        update-types: [minor, patch]
        patterns:
          - 'serde'
          - 'serde_*'
          - 'specta'
          - 'specta-*'
          - 'toml'
          - 'quick-xml'
          - 'yaml-rust2'
      rust-other:
        update-types: [minor, patch]
        exclude-patterns:
          - 'tauri'
          - 'tauri-*'
          - 'diesel'
          - 'diesel_*'
          - 'libsqlite3-sys'
          - 'aes-gcm'
          - 'argon2'
          - 'zeroize'
          - 'getrandom'
          - 'md-5'
          - 'sha1'
          - 'sha2'
          - 'sha3'
          - 'hmac'
          - 'reqwest'
          - 'rustls'
          - 'rustls-*'
          - 'tokio'
          - 'tokio-*'
          - 'futures-util'
          - 'url'
          - 'percent-encoding'
          - 'psl'
          - 'serde'
          - 'serde_*'
          - 'specta'
          - 'specta-*'
          - 'toml'
          - 'quick-xml'
          - 'yaml-rust2'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      # The npm half of the Tauri rule above.
      - dependency-name: '@tauri-apps/*'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      # `@angular/build` declares `vitest@^4` as its peer: a 5 fails `npm ci` with ERESOLVE.
      # Lifted, and the three bumped together, once the builder accepts it.
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/*'
        update-types: ['version-update:semver-major']
      # The same for TypeScript: `@angular/build` takes the major it was built for, and 7 fails
      # `npm ci` with ERESOLVE. It moves with Angular, through `ng update`.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-*/*'
          - 'angular-eslint'
      tauri:
        patterns:
          - '@tauri-apps/*'
      rich-editor:
        patterns:
          - '@tiptap/*'
      # The snippet editor: CodeMirror, its grammars, and the community ones beside them.
      code-editor:
        patterns:
          - '@codemirror/*'
          - '@lezer/*'
          - 'cm6-graphql'
          - 'codemirror-lang-*'
          - 'graphql'
      e2e:
        patterns:
          - '@wdio/*'
          - 'webdriverio'
      unit-tests:
        update-types: [minor, patch]
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'jsdom'
      lint-and-format:
        update-types: [minor, patch]
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier'
      npm-other:
        update-types: [minor, patch]
        exclude-patterns:
          - '@angular/*'
          - '@angular-*/*'
          - 'angular-eslint'
          - '@tauri-apps/*'
          - '@tiptap/*'
          - '@codemirror/*'
          - '@lezer/*'
          - 'cm6-graphql'
          - 'codemirror-lang-*'
          - 'graphql'
          - '@wdio/*'
          - 'webdriverio'
          - 'vitest'
          - '@vitest/*'
          - 'jsdom'
          - 'eslint'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier'

  # Pinned action versions go stale silently: nothing in a green run says an action
  # is two majors behind.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - '*'
