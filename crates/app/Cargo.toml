[package]
name = "app"
description = "A developer's notes and snippets manager for the desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
readme = "../../README.md"
publish = false

[[bin]]
name = "devnotes"
path = "src/main.rs"

[features]
# The flavour the end-to-end scenarios drive: never in a release.
e2e = ["eframe/inspection", "platform/e2e"]
# egui's frames, for `puffin_viewer` on 127.0.0.1:8585: never in a release.
profiling = ["dep:profiling", "dep:puffin", "dep:puffin_http", "profiling/profile-with-puffin"]

[dependencies]
engine.workspace = true
platform.workspace = true
ui.workspace = true
eframe.workspace = true
egui = { workspace = true, features = ["default"] }
flexi_logger.workspace = true
log.workspace = true
profiling = { workspace = true, optional = true }
puffin = { workspace = true, optional = true }
puffin_http = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# The one eframe uses, for its X11 switch (D15).
winit.workspace = true

[dev-dependencies]
i18n.workspace = true
# `examples/icons.rs`, which draws the icons.
resvg.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
