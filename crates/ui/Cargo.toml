[package]
name = "ui"
description = "The egui interface of DevNotes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
engine = { path = "../engine" }
text = { path = "../text" }
richtext = { path = "../richtext" }
diagram = { path = "../diagram" }
drawing = { path = "../drawing" }
platform = { path = "../platform" }
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "system_fonts", "wayland", "wgpu", "x11"] }
egui = "0.37.0"
resvg = { version = "0.49.0", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5.15"
i18n = { path = "../i18n" }
serde_json = "1.0.151"
rayon = "1.11.0"
zeroize = "1.9.0"
log = "0.4.34"
base64 = "0.23.1"
png = "0.18.1"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "net", "time"] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe", "wgpu", "snapshot"] }
tempfile = "3.27.0"

[lints]
workspace = true
