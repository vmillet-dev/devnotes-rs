[workspace]
resolver = "3"
members = ["crates/engine", "crates/text", "crates/richtext", "crates/drawing", "crates/diagram", "crates/i18n", "crates/platform", "crates/ui", "crates/app", "e2e"]

[workspace.package]
version = "1.0.1"
edition = "2024"
# The pinned toolchain's (`rust-toolchain.toml`): below it, Cargo's MSRV-aware resolver quietly
# holds crates back.
rust-version = "1.97"
authors = ["Valentin MILLET"]
repository = "https://github.com/vmillet-dev/devnotes-rs"
license = "GPL-3.0-only"

[workspace.dependencies]
diagram = { path = "crates/diagram" }
drawing = { path = "crates/drawing" }
engine = { path = "crates/engine" }
i18n = { path = "crates/i18n" }
platform = { path = "crates/platform" }
richtext = { path = "crates/richtext" }
text = { path = "crates/text" }
ui = { path = "crates/ui" }

aes-gcm = { version = "0.11.1", features = ["zeroize"] }
arboard = "3.7.0"
argon2 = "0.6.0"
auto-launch = "0.6.0"
base64 = "0.23.1"
cargo-packager-updater = "0.2.3"
chrono = { version = "0.4.45", default-features = false }
chrono-tz = "0.10.4"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
croner = "4.0.1"
crossbeam-channel = "0.5.15"
deunicode = "1.6.2"
diesel = { version = "2.4.0", features = ["sqlite"] }
diesel_migrations = { version = "2.4.0", features = ["sqlite"] }
dirs = "6.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "system_fonts", "wayland", "wgpu", "x11"] }
egui = { version = "0.37.0", default-features = false }
egui_inspection = "0.37.0"
egui_kittest = { version = "0.37.0", features = ["eframe", "wgpu", "snapshot"] }
flexi_logger = { version = "0.31.10", default-features = false }
futures-util = { version = "0.3.33", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
global-hotkey = "0.9.0"
gtk = "0.18.2"
hmac = "0.13.0"
html5ever = "0.40.1"
iana-time-zone = "0.1.65"
iban_validate = "5.0.1"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"] }
interprocess = "2.4.7"
ipnet = "2.12.2"
libsqlite3-sys = { version = "0.40.0", features = ["bundled"] }
log = "0.4.34"
md-5 = "0.11.0"
merman = { version = "=0.9.3", default-features = false, features = ["all-diagrams", "complete-svg", "native-fonts"] }
notify-rust = "4.18.2"
open = "5.4.5"
percent-encoding = "2.3.2"
png = "0.18.1"
profiling = "1.0.18"
psl = "2.1.241"
puffin = "0.20.0"
puffin_http = "0.17.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
qrcode = { version = "0.14.1", default-features = false }
quick-xml = "0.42.0"
rayon = "1.11.0"
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "http2", "form", "multipart", "charset"] }
resvg = { version = "0.49.0", default-features = false }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
ropey = "1.6.1"
rquickjs = "0.14.0"
rust_decimal = { version = "1.43.0", default-features = false, features = ["std", "maths"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
sha3 = "0.12.0"
similar = "3.2.0"
skrifa = "0.44.0"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-onig", "yaml-load"] }
sys-locale = "0.3.2"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", default-features = false }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "__rustls-tls"] }
toml = "1.1.3"
tray-icon = "0.26.1"
tungstenite = "0.30.0"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4"] }
winit = { version = "0.30.13", default-features = false, features = ["x11"] }
winreg = "0.56.0"
yaml-rust2 = "0.13.0"
zbus = "5.19.0"
zeroize = "1.9.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }

# Deriving a key is slow on purpose; unoptimised, every test that unlocks a library paid it
# many times over.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Speed first: "s" or 2 make the binary smaller (62.4 or 76.0 MB against 78.6) and the core
# slower (a query over 8000 notes +37 % or +7 %), and per-crate levels do not reach Rust code
# under fat LTO. The figures: architecture.md, "The release binary".
[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
