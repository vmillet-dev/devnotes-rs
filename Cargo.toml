[workspace]
resolver = "3"
members = ["crates/engine", "src-tauri"]

[workspace.package]
version = "0.18.0"
edition = "2024"
# The pinned toolchain's (`rust-toolchain.toml`): below it, Cargo's MSRV-aware resolver quietly
# holds crates back (Tauri 2.12 needs 1.90) while their npm twins move on.
rust-version = "1.97"
authors = ["Valentin MILLET"]
repository = "https://github.com/vmillet-dev/devnotes-rs"
license = "GPL-3.0-only"

[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
